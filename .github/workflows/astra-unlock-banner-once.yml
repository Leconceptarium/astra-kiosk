name: Astra unlock banner patch once

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch banner
        run: |
          python3 -c "from pathlib import Path; p=Path('index.html'); s=p.read_text(); s=s.replace('display: none !important;\\n    }\\n\\n    body.projecting #fullscreenBtn,','display: block !important;\\n    }\\n\\n    body.projecting #fullscreenBtn,',1); s=s.replace('// Cache le bandeau\\n\\n        elements.bandeau.style.display =\\n          \"none\";','// Message apres deverrouillage\\n        const m={fr:\"ASTRA ARCHIVE TOUS VOS PARCHEMINS. VOUS POUVEZ DÉSORMAIS Y ACCÉDER.\",en:\"ASTRA ARCHIVES ALL YOUR SCROLLS. YOU MAY NOW ACCESS THEM.\",de:\"ASTRA ARCHIVIERT ALLE EURE SCHRIFTROLLEN. IHR KÖNNT JETZT DARAUF ZUGREIFEN.\"};\\n        const b=elements.bandeau.querySelector(\"span\");\\n        if(b)b.textContent=m[state.currentLang]||m.fr;\\n        elements.bandeau.style.removeProperty(\"display\");',1); p.write_text(s)"

      - name: Commit
        run: |
          git config user.name "Leconceptarium"
          git config user.email "toitotmax@gmail.com"
          git add index.html
          git commit -m "Show scroll access message after Astra unlock" || exit 0
          git push
