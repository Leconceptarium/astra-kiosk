  <style>

    * {

      box-sizing: border-box;

    }

    html, body {

      margin: 0;

      overflow: hidden;

      height: 100vh;

      background: #000;

    }

    body {

      display: flex;

      justify-content: center;

      align-items: center;

      font-family: 'Unica One', serif;

      transform: scaleX(-1);

    }

    video {

      position: absolute;

      top: 50%;

      left: 50%;

      width: 95%;

      height: auto;

      transform: translate(-50%, -50%);

      object-fit: contain;

      background: #000;

      opacity: 0;

      transition: opacity 0.6s ease;

      display: none;

    }

    #astraIdle.active,

    #astraIdle2.active {

      display: block;

      opacity: 1;

      z-index: 1;

    }

    #astraReaction {

      z-index: 2;

      display: none;

    }

    /* ===== BANDEAU ===== */

    #bandeau {

      position: fixed;

      bottom: 8%;

      width: 100%;

      background: transparent;

      color: rgba(0, 255, 220, 0.85);

      font-size: clamp(1.2rem, 3vw, 2.2rem);

      text-align: center;

      padding: 0 5%;

      text-shadow:

        0 0 15px rgba(0, 255, 200, 0.8),

        0 0 30px rgba(0, 255, 200, 0.4);

      letter-spacing: 2px;

      z-index: 3;

      animation: bandeauPulse 4s ease-in-out infinite;

      pointer-events: none;

    }

    #bandeau span {

      display: block;

      white-space: normal;

    }

    @keyframes bandeauPulse {

      0%, 100% {

        opacity: 0.35;

      }

      50% {

        opacity: 0.9;

      }

    }

    /* ===== PARCHEMIN ===== */

    #parcheminImage {

      position: fixed;

      top: 50%;

      left: 50%;

      transform: translate(-50%, -50%);

      max-width: 80%;

      max-height: 80%;

      z-index: 4;

      display: none;

      opacity: 0;

      transition: opacity 0.5s ease;

    }

    #parcheminImage.visible {

      opacity: 1;

    }

    /* ===== PARTICULES MAGIQUES ===== */

    .magic {

      position: absolute;

      width: 26px;

      height: 26px;

      border-radius: 50%;

      background: radial-gradient(

        circle,

        rgba(0, 255, 255, 0.8) 0%,

        rgba(0, 255, 150, 0.25) 40%,

        rgba(0, 100, 100, 0.1) 65%,

        transparent 85%

      );

      filter: blur(3px) brightness(2.2);

      mix-blend-mode: screen;

      animation: fallMagic 6s ease-in-out forwards;

      pointer-events: none;

      z-index: 5;

    }

    @keyframes fallMagic {

      0% {

        transform: translateY(-600px) scale(1.3) rotate(0deg);

        opacity: 0;

      }

      20% {

        opacity: 1;

      }

      60% {

        transform: translateY(0px) scale(0.8) rotate(180deg);

        opacity: 0.9;

      }

      100% {

        transform: translateY(400px) scale(0.6) rotate(360deg);

        opacity: 0;

      }

    }

    /* ===== TRANSITION MAGIQUE ===== */

    #transitionFade {

      position: fixed;

      inset: 0;

      background: radial-gradient(

        circle at center,

        rgba(0, 255, 255, 0.9) 0%,

        rgba(0, 255, 150, 0.4) 30%,

        rgba(0, 100, 100, 0.2) 55%,

        transparent 75%

      );

      opacity: 0;

      pointer-events: none;

      transition: opacity 1.2s ease;

      z-index: 9;

    }

    /* ======================================================

       INTERFACE STAFF

       ====================================================== */

    #fullscreenBtn,

    #statusIndicator,

    #languageSelector,

    #debugToggle,

    #debugPanel {

      display: none !important;

    }

    body.staffMode #fullscreenBtn,

    body.staffMode #statusIndicator,

    body.staffMode #languageSelector,

    body.staffMode #debugToggle {

      display: flex !important;

    }

    body.staffMode #debugPanel.visible {

      display: block !important;

    }

    #fullscreenBtn {

      position: fixed;

      bottom: 20px;

      right: 25px;

      z-index: 10;

      width: 50px;

      height: 50px;

      border: 2px solid rgba(255,255,255,0.3);

      border-radius: 50%;

      color: #fff;

      font-size: 22px;

      text-align: center;

      line-height: 46px;

      cursor: pointer;

      background: rgba(255,255,255,0.08);

      transition: all .3s ease;

      user-select: none;

      transform: scaleX(-1);

    }

    #fullscreenBtn:hover {

      background: rgba(255,255,255,0.2);

      border-color: rgba(255,255,255,0.6);

      transform: scaleX(-1) scale(1.1);

    }

    /* ===== STATUT ===== */

    #statusIndicator {

      position: fixed;

      top: 20px;

      right: 25px;

      z-index: 10;

      align-items: center;

      gap: 10px;

      padding: 10px 15px;

      background: rgba(0,0,0,0.5);

      border-radius: 20px;

      color: #fff;

      font-size: 14px;

      opacity: 0;

      transition: opacity 0.3s ease;

      transform: scaleX(-1);

    }

    #statusIndicator.visible {

      opacity: 1;

    }

    .status-dot {

      width: 10px;

      height: 10px;

      border-radius: 50%;

      background: #ff4444;

      animation: pulse 2s infinite;

    }

    .status-dot.listening {

      background: #44ff44;

    }

    @keyframes pulse {

      0%, 100% {

        opacity: 1;

      }

      50% {

        opacity: 0.5;

      }

    }

    /* ===== ERREUR ===== */

    #errorMessage {

      position: fixed;

      top: 50%;

      left: 50%;

      transform:

        translate(-50%, -50%)

        scaleX(-1);

      background: rgba(255, 50, 50, 0.9);

      color: white;

      padding: 20px 40px;

      border-radius: 10px;

      z-index: 11;

      display: none;

      text-align: center;

      max-width: 80%;

    }

    /* ===== DEBUG ===== */

    #debugPanel {

      position: fixed;

      bottom: 80px;

      left: 20px;

      background: rgba(0, 0, 0, 0.9);

      color: #0f0;

      padding: 15px;

      border-radius: 10px;

      font-family: monospace;

      font-size: 12px;

      max-width: 500px;

      max-height: 350px;

      overflow-y: auto;

      z-index: 12;

      transform: scaleX(-1);

    }

    #debugToggle {

      position: fixed;

      bottom: 80px;

      left: 20px;

      z-index: 13;

      padding: 8px 16px;

      background: rgba(0, 255, 0, 0.2);

      border: 2px solid rgba(0, 255, 0, 0.5);

      border-radius: 20px;

      color: #0f0;

      cursor: pointer;

      font-size: 12px;

      transform: scaleX(-1);

    }

    /* ===== LANGUES ===== */

    #languageSelector {

      position: fixed;

      top: 20px;

      left: 25px;

      z-index: 10;

      gap: 10px;

      transform: scaleX(-1);

    }

    .lang-btn {

      padding: 8px 16px;

      background: rgba(255,255,255,0.1);

      border: 2px solid rgba(255,255,255,0.3);

      border-radius: 20px;

      color: #fff;

      cursor: pointer;

      transition: all 0.3s ease;

    }

    }

      background: rgba(0, 255, 255, 0.3);

    #staffTapZone {

      position: fixed;

      top: 0;

      left: 0;

      width: 80px;

      height: 80px;

      z-index: 20;

    }

      message,

      duration = 2000

    ) {

      elements.errorMessage.textContent =

      elements.errorMessage.style.display =

      setTimeout(

        () => {

          elements.errorMessage.style.display =

            "none";

        },

      );

    },

    updateStatus(

      textKey,

      isListening = false

    ) {

      const text =

        translations[state.currentLang][textKey]

        || textKey;

      elements.statusText.textContent =

        text;

      if (isListening) {

        elements.statusDot

          .classList

          .add("listening");

      } else {

        elements.statusDot

          .classList

          .remove("listening");

      }

      elements.statusIndicator

        .classList

        .add("visible");

    },

      delay = 2000

    ) {

        () => {

          elements.statusIndicator

            .classList

            .remove("visible");

        },

  const phraseDetector = {

    normalize(text) {

      return text

        .toLowerCase()

        .trim();

    },

    detect(text) {

      const t =

        this.normalize(text);

      const lang =

        state.currentLang;

      const audio =

        audioFiles[lang];

      debugLogger.log(

        `Analyse phrase (${lang}) : "${t}"`,

        "info"

      );

      // ======================================================

      // FRANÇAIS

      // ======================================================

      if (lang === "fr") {

        // Bonjour / salut

        if (

          /bonjour|salut|coucou|bonsoir|wesh|yo/i.test(t)

        ) {

          return {

            file: audio.bonjour,

            video: VIDEO.happy

          };

        }

        // Qui es-tu ?

        if (

          /qui (tu es|es-tu)|t'es qui|c'est quoi toi|astra|c'est quoi ce truc/i.test(t)

        ) {

          return {

            file: audio.qui,

            video: VIDEO.happy

          };

        }

        // Où sommes-nous ?

        if (

          /où sommes|on est où|quel est cet endroit/i.test(t)

        ) {

          return {

            file: audio.ou,

            video: VIDEO.anxious

          };

        }

        // Mot de passe

        if (

          /bonne nuit|le mot de passe c'est bonne nuit/i.test(t)

        ) {

          return this.handlePassword();

        }

        // Mot de passe oublié

        if (

          /mot de passe oublié|j'ai oublié|comment trouver/i.test(t)

        ) {

          return {

            file: audio.mdp_oublie,

            video: VIDEO.anxious

          };

        }

        // Pétunia

        if (

          /pétunia|petunia/i.test(t)

        ) {

          return {

            file: audio.petunia,

            video: VIDEO.angry

          };

        }

        // Parchemin

        if (

          /parchemin|marchemin|par chemin|potion.*libération|potion.*liberation|recette.*libération|recette.*liberation/i.test(t)

        ) {

          return this.handleParchemin();

        }

        // Mot de passe trouvé

        if (

          /je connais le mot de passe|j'ai trouvé le mot de passe|on a trouvé le mot de passe/i.test(t)

        ) {

          return {

            file: audio.invite_mdp,

            video: VIDEO.anxious

          };

        }

        // Ça va ?

        if (

          /ça va|ca va|comment tu vas|tu vas bien/i.test(t)

        ) {

          return {

            file: audio.ca_va,

            video: VIDEO.happy

          };

        }

        // Tu es là ?

        if (

          /tu es là|tu es la|t'es là|t'es la|hé ho|hey ho|tu m'entends|tu nous entends/i.test(t)

        ) {

          return {

            file: audio.tu_es_la,

            video: VIDEO.anxious

          };

        }

        // Berceuse

        if (

          /berceuse|musique pour dormir|chante.*berceuse/i.test(t)

        ) {

          return {

            file: audio.berceuse,

            video: VIDEO.talk

          };

        }

        // Tu crois en nous ?

        if (

          /tu crois en nous|on va réussir|on va reussir|tu penses qu'on va réussir|tu penses qu'on va reussir/i.test(t)

        ) {

          return {

            file: audio.reve_croire,

            video: VIDEO.confident

          };

        }

        // Pourquoi les humains ne rêvent plus ?

        if (

          /pourquoi les humains ne rêvent plus|pourquoi les humains ne revent plus|pourquoi on ne rêve plus|pourquoi on ne reve plus/i.test(t)

        ) {

          return {

            file: audio.pq_reve_plus,

            video: VIDEO.suspicionAlt

          };

        }

        // Qui est Morpheus ?

        if (

          /qui est morpheus|c'est qui morpheus|qui c'est morpheus/i.test(t)

        ) {

          return {

            file: audio.qui_morpheus,

            video: VIDEO.walkTalk

          };

        }

        // Apparence de Morpheus

        if (

          /à quoi ressemble morpheus|a quoi ressemble morpheus|apparence.*morpheus|morpheus ressemble à quoi|morpheus ressemble a quoi/i.test(t)

        ) {

          return {

            file: audio.morpheus_apparence,

            video: VIDEO.suspicionAlt

          };

        }

        // Blague

        if (

          /blague|raconte.*blague|fais.*blague/i.test(t)

        ) {

          return this.handleJoke();

        }

        // Tu aimes Morpheus ?

        if (

          /tu aimes morpheus|tu aime morpheus|tu nous aimes|tu nous aime/i.test(t)

        ) {

          return {

            file: audio.tu_aime_morpheus,

            video: VIDEO.happy

          };

        }

        // Solution

        if (

          /solution|donne.*réponse|donne.*reponse/i.test(t)

        ) {

          return {

            file: audio.la_solution,

            video: VIDEO.walkTalk

    // ========================================================

    // MOT DE PASSE

    // ========================================================

    handlePassword() {

      const audio =

        audioFiles[

          state.currentLang

        ];

      // Première validation

      if (

        !state.mdpValid

      ) {

        debugLogger.log(

          "✓ MOT DE PASSE CORRECT",

          "success"

        );

        state.mdpValid =

          true;

        // On cache le bandeau

        elements.bandeau

          .style.display =

          "none";

        /*

         On lance la suite magique séparément.

         La réponse mdp_confirme est retournée

         normalement à onresult.

         startPasswordSequence attend ensuite

         qu'Astra ait fini de parler avant de

         jouer la notification.

        */

        this.startPasswordSequence();

        return {

          file:

            audio.mdp,

          video:

            VIDEO.happy

        };

      }

      // Mot de passe déjà validé

      return {

        file:

          audio.mdp,

        video:

          VIDEO.walkTalk

      };

    },

    // ========================================================

    // SÉQUENCE APRÈS MOT DE PASSE

    // ========================================================

    startPasswordSequence() {

      const audio =

        audioFiles[

          state.currentLang

        ];

      /*

       On laisse d'abord onresult appeler

       audioManager.play(audio.mdp).

       Puis on surveille state.isPlaying.

       Lorsque la confirmation est terminée,

       on déclenche la transformation.

      */

      const waitForConfirmationEnd =

        () => {

          if (

            state.isPlaying

          ) {

            setTimeout(

              waitForConfirmationEnd,

              200

            );

            return;

          }

          debugLogger.log(

            "Début transformation mot de passe",

            "success"

          );

          // Particules magiques

          magicEffects.cascade(

            40,

            150

          );

          // Transition

          elements.fade.style.opacity =

            "1";

          setTimeout(

            () => {

              elements.astraIdle

                .classList

                .remove(

                  "active"

                );

              videoManager.activateIdle(

                elements.astraIdle2

              );

              elements.fade.style.opacity =

                "0";

            },

            1500

          );

          /*

           Petite notification vocale.

           audioManager ajoutera automatiquement

           le bip robotique avant celle-ci aussi.

          */

          audioManager.play(

            audio.notif,

            VIDEO.walkTalk

          );

        };

      /*

       300 ms permettent à onresult

       de lancer la première réponse avant

       qu'on vérifie state.isPlaying.

      */

      setTimeout(

        waitForConfirmationEnd,

        300

      );

    },

    // PARCHEMIN

    // ========================================================

    handleParchemin() {

      const audio =

        audioFiles[

          state.currentLang

        ];

      if (

        state.mdpValid

      ) {

        debugLogger.log(

          "✓ Affichage parchemin",

          "success"

        );

        parcheminManager.show(

          15000

        );

        const video =

          PARCHEMIN_VIDEO[

            state.currentLang

          ]

          || VIDEO.read;

        return {

          file:

            audio.parchemin,

          video:

        };

      /*

       avant le mot de passe.

      */

      debugLogger.log(

        "Parchemin demandé avant mot de passe",

        "warn"

      );

      const faux =

        ];

      /*

       La blague est retournée normalement.

       avant de jouer le rire.

      const waitForJokeEnd =

          if (

    // ==========================================================

  // RECONNAISSANCE VOCALE

  // ==========================================================

  const speechRecognition = {

    getLangCode() {

      const codes = {

        fr: "fr-FR",

        en: "en-US",

        de: "de-DE"

      };

      return codes[state.currentLang] || "fr-FR";

    },

    // ========================================================

    // INITIALISATION

    // ========================================================

    init() {

      const SpeechRecognition =

        window.SpeechRecognition ||

        window.webkitSpeechRecognition;

      if (!SpeechRecognition) {

        debugLogger.log(

          "SpeechRecognition non disponible",

          "error"

        );

        utils.showError(

          translations[state.currentLang]

            .errorSpeechNotSupported,

          5000

        );

        return false;

      }

      debugLogger.log(

        "✓ API SpeechRecognition disponible",

        "success"

      );

      // Nettoyage d'une éventuelle ancienne instance

      if (state.recognition) {

        try {

          state.recognition.abort();

        } catch (_) {}

      }

      state.recognition =

        new SpeechRecognition();

      /*

       Safari peut quand même couper la reconnaissance

       même avec continuous = true.

       Le onend plus bas s'occupe donc de la relancer.

      */

      state.recognition.continuous =

        true;

      state.recognition.interimResults =

        false;

      state.recognition.maxAlternatives =

        1;

      state.recognition.lang =

        this.getLangCode();

      debugLogger.log(

        `Langue reconnaissance : ${state.recognition.lang}`,

        "info"

      );

      // ======================================================

      // DÉMARRAGE EFFECTIF

      // ======================================================

      state.recognition.onstart =

        () => {

          state.recognitionRunning =

            true;

          state.needsGestureRestart =

            false;

          debugLogger.log(

            "🎙️ Astra écoute",

            "success"

          );

          utils.updateStatus(

            "listening",

            true

          );

        };

      // ======================================================

      // VOIX DÉTECTÉE

      // ======================================================

      state.recognition.onspeechstart =

        () => {

          debugLogger.log(

            "🎙️ Voix détectée",

            "speech"

          );

        };

      state.recognition.onspeechend =

        () => {

          debugLogger.log(

            "Fin de phrase détectée",

            "speech"

          );

        };

      // ======================================================

      // RÉSULTAT VOCAL

      // ======================================================

      state.recognition.onresult =

        event => {

          try {

            const result =

              event.results[

                event.results.length - 1

              ];

            const alternative =

              result[0];

            const text =

              alternative.transcript

                .trim();

            const confidence =

              typeof alternative.confidence === "number"

                ? alternative.confidence

                : 0;

            debugLogger.log(

              `🎙️ Entendu : "${text}"`,

              "speech"

            );

            debugLogger.log(

              `Confiance : ${Math.round(confidence * 100)}%`,

              "info"

            );

            /*

             Si Astra parle déjà,

             on ignore les résultats.

             Ça évite qu'elle entende

             ses propres haut-parleurs.

            */

            if (state.isPlaying) {

              debugLogger.log(

                "Résultat ignoré : Astra parle déjà",

                "warn"

              );

              return;

            }

            // Analyse de la phrase

            const response =

              phraseDetector.detect(

                text

              );

            if (

              response &&

              response.file

            ) {

              debugLogger.log(

                `✓ Réponse choisie : ${response.file}`,

                "success"

              );

              /*

               audioManager va :

               1. jouer biprobotic.mp3

               2. charger la réponse pendant le bip

               3. lancer la réponse à la fin du bip

              */

              audioManager.play(

                response.file,

                response.video

              );

            } else {

              debugLogger.log(

                "Aucune réponse retournée",

                "warn"

              );

            }

          } catch (err) {

            debugLogger.log(

              `Erreur résultat vocal : ${err.message}`,

              "error"

            );

          }

        };

      // ======================================================

      // ERREURS SPEECH RECOGNITION

      // ======================================================

      state.recognition.onerror =

        event => {

          const error =

            event.error ||

            "inconnue";

          debugLogger.log(

            `Erreur reconnaissance : ${error}`,

            "error"

          );

          // Aucun son détecté

          if (

            error === "no-speech"

          ) {

            debugLogger.log(

              "Pas de parole détectée",

              "info"

            );

            return;

          }

          // Arrêt volontaire

          if (

            error === "aborted"

          ) {

            debugLogger.log(

              "Reconnaissance interrompue",

              "info"

            );

            return;

          }

          /*

           Safari peut renvoyer not-allowed

           lors d'une tentative de restart

           sans nouveau geste utilisateur.

          */

          if (

            error === "not-allowed"

          ) {

            state.needsGestureRestart =

              true;

            debugLogger.log(

              "⚠️ Safari demande un nouveau tap pour relancer le micro",

              "warn"

            );

            utils.updateStatus(

              "micDisabled",

              false

            );

            return;

          }

          // Micro indisponible

          if (

            error === "audio-capture"

          ) {

            debugLogger.log(

              "Microphone indisponible",

              "error"

            );

            utils.updateStatus(

              "micError",

              false

            );

            return;

          }

          // Web Speech peut avoir besoin du réseau

          if (

            error === "network"

          ) {

            debugLogger.log(

              "Erreur réseau SpeechRecognition",

              "error"

            );

            utils.updateStatus(

              "micError",

              false

            );

            return;

          }

          utils.updateStatus(

            "micError",

            false

          );

        };

      // ======================================================

      // FIN DE RECONNAISSANCE

      // ======================================================

      state.recognition.onend =

        () => {

          state.recognitionRunning =

            false;

          debugLogger.log(

            "Reconnaissance arrêtée",

            "info"

          );

          /*

           Changement de langue :

           languageManager gère lui-même

           le redémarrage.

          */

          if (

            state.manualStop

          ) {

            state.manualStop =

              false;

            return;

          }

          /*

           Safari exige un nouveau geste :

           on attend un tap.

          */

          if (

            state.needsGestureRestart

          ) {

            debugLogger.log(

              "En attente d'un tap écran",

              "warn"

            );

            return;

          }

          if (

            !state.started

          ) {

            return;

          }

          /*

           Relance automatique.

           350 ms au lieu d'une seconde :

           Astra revient plus rapidement

           en écoute.

          */

          setTimeout(

            () => {

              if (

                !state.started ||

                state.needsGestureRestart

              ) {

                return;

              }

              this.start();

            },

            350

          );

        };

      return true;

    },

    // ========================================================

    // LANGUE

    // ========================================================

    updateLanguage() {

      if (

        !state.recognition

      ) {

        return;

      }

      state.recognition.lang =

        this.getLangCode();

      debugLogger.log(

        `Nouvelle langue micro : ${state.recognition.lang}`,

        "info"

      );

    },

    // ========================================================

    // START

    // ========================================================

    start() {

      if (

        !state.recognition

      ) {

        return;

      }

      if (

        state.recognitionRunning

      ) {

        return;

      }

      try {

        state.recognition.start();

        debugLogger.log(

          "recognition.start() envoyé",

          "info"

        );

      } catch (err) {

        /*

         InvalidStateError = Safari pense

         généralement que le micro tourne

         encore.

         Ce n'est pas grave.

        */

        if (

          err.name ===

          "InvalidStateError"

        ) {

          debugLogger.log(

            "Reconnaissance déjà active selon Safari",

            "info"

          );

          return;

        }

        debugLogger.log(

          `Erreur start : ${err.name} / ${err.message}`,

          "error"

        );

        state.needsGestureRestart =

          true;

      }

    }

  };

  // ==========================================================

  // APPLICATION

  // ==========================================================

  const app = {

    initialized:

      false,

    init() {

      if (

        this.initialized

      ) {

        return;

      }

      this.initialized =

        true;

      try {

        debugLogger.log(

          "Initialisation Astra...",

          "info"

        );

        // Vidéos

        videoManager.setupLoops();

        videoManager.activateIdle(

          elements.astraIdle

        );

        // Langues

        languageManager.init();

        // Reconnaissance

        if (

          speechRecognition.init()

        ) {

          speechRecognition.start();

          utils.updateStatus(

            "ready",

            true

          );

          utils.hideStatus(

            3000

          );

          debugLogger.log(

            "★★★★★ ASTRA EST PRÊTE ★★★★★",

            "success"

          );

        } else {

          utils.showError(

            translations[

              state.currentLang

            ].errorSpeechNotAvailable,

            5000

          );

        }

      } catch (err) {

        debugLogger.log(

          `ERREUR INITIALISATION : ${err.message}`,

          "error"

        );

        utils.showError(

          translations[

            state.currentLang

          ].errorMicDenied,

          5000

        );

      }

    }

  };

  // ==========================================================

  // PREMIER TAP STAFF + MODE STAFF

  // ==========================================================

  let staffTapCount =

    0;

  let staffTapTimer =

    null;

  elements.staffTapZone

    .addEventListener(

      "click",

      () => {

        // ====================================================

        // PREMIER TAP = DÉMARRAGE ASTRA

        // ====================================================

        if (

          !state.started

        ) {

          state.started =

            true;

          debugLogger.log(

            "👆 Premier tap staff",

            "success"

          );

          /*

           IMPORTANT IPAD :

           audioManager.unlock() doit rester

           directement dans cet événement click.

           Ne pas le mettre dans un setTimeout.

          */

          audioManager.unlock();

          /*

           On débloque également le bip

           avec le geste utilisateur.

           On le joue silencieusement puis

           on le remet au début.

          */

          try {

            const bip =

              audioManager.thinkingAudio;

            bip.volume =

              0.01;

            const bipUnlock =

              bip.play();

            if (

              bipUnlock &&

              bipUnlock.then

            ) {

              bipUnlock

                .then(

                  () => {

                    bip.pause();

                    try {

                      bip.currentTime =

                        0;

                    } catch (_) {}

                    bip.volume =

                      1;

                    debugLogger.log(

                      "✓ Lecteur bip débloqué",

                      "success"

                    );

                  }

                )

                .catch(

                  err => {

                    bip.volume =

                      1;

                    debugLogger.log(

                      `Unlock bip refusé : ${err.message}`,

                      "warn"

                    );

                  }

                );

            }

          } catch (err) {

            debugLogger.log(

              `Erreur unlock bip : ${err.message}`,

              "warn"

            );

          }

          // Vidéo initiale

          try {

            elements.astraIdle.muted =

              true;

            elements.astraIdle.style.display =

              "block";

            elements.astraIdle

              .classList

              .add(

                "active"

              );

            elements.astraIdle

              .play()

              .catch(

                () => {}

              );

          } catch (_) {}

          /*

           Initialisation immédiate.

           On ne met pas de await ici :

           on veut rester le plus proche

           possible du geste utilisateur.

          */

          app.init();

          return;

        }

        // ====================================================

        // 5 TAPS = MODE STAFF

        // ====================================================

        staffTapCount++;

        clearTimeout(

          staffTapTimer

        );

        staffTapTimer =

          setTimeout(

            () => {

              staffTapCount =

                0;

            },

            2000

          );

        if (

          staffTapCount >= 5

        ) {

          document.body

            .classList

            .toggle(

              "staffMode"

            );

          staffTapCount =

            0;

          debugLogger.log(

            document.body

              .classList

              .contains(

                "staffMode"

              )

              ? "Mode staff activé"

              : "Mode staff désactivé",

            "info"

          );

        }

      }

    );

  // ==========================================================

  // TAP DE SECOURS iPAD

  // ==========================================================

  /*

   Si Safari a coupé SpeechRecognition

   et exige un geste utilisateur,

   n'importe quel tap sur l'écran

   permet de le relancer.

  */

  document.addEventListener(

    "touchstart",

    () => {

      if (

        !state.started

      ) {

        return;

      }

      if (

        !state.needsGestureRestart

      ) {

        return;

      }

      debugLogger.log(

        "👆 Tap secours iOS",

        "info"

      );

      state.needsGestureRestart =

        false;

      /*

       Nouveau geste utilisateur =

       nouvelle tentative de déblocage audio.

      */

      audioManager.unlock();

      if (

        state.recognition

      ) {

        speechRecognition.start();

      } else {

        if (

          speechRecognition.init()

        ) {

          speechRecognition.start();

        }

      }

    },

    {

      passive: true

    }

  );

  // ==========================================================

  // RETOUR APRÈS VEILLE / CHANGEMENT D'APPLICATION

  // ==========================================================

  document.addEventListener(

    "visibilitychange",

    () => {

      if (

        document.visibilityState !==

        "visible"

      ) {

        debugLogger.log(

          "Page en arrière-plan",

          "info"

        );

        return;

      }

      debugLogger.log(

        "Page redevenue visible",

        "info"

      );

      if (

        !state.started

      ) {

        return;

      }

      setTimeout(

        () => {

          if (

            !state.recognitionRunning &&

            !state.needsGestureRestart

          ) {

            speechRecognition.start();

          }

        },

        800

      );

    }

  );

  // ==========================================================

  // CHARGEMENT INITIAL

  // ==========================================================

  window.addEventListener(

    "load",

    () => {

      utils.updateBandeau();

      /*

       On demande immédiatement au navigateur

       de précharger les MP3.

       Le bip et la réponse auront ainsi

       beaucoup plus de chances d'être

       déjà disponibles au moment où

       le joueur parle.

      */

      audioPreloader.preloadAll();

      debugLogger.log(

        "================================",

        "info"

      );

      debugLogger.log(

        "ASTRA — VERSION iPad + BIP",

        "success"

      );

      debugLogger.log(

        "Page chargée",

        "success"

      );

      debugLogger.log(

        "En attente du premier tap staff...",

        "info"

      );

      debugLogger.log(

        "================================",

        "info"

      );

    }

  );

  // ==========================================================

  // ERREURS JAVASCRIPT GLOBALES

  // ==========================================================

  window.addEventListener(

    "error",

    event => {

      debugLogger.log(

        `ERREUR JS : ${event.message} — ligne ${event.lineno}`,

        "error"

      );

    }

  );

  // ==========================================================

  // PROMESSES REJETÉES

  // ==========================================================

  window.addEventListener(

    "unhandledrejection",

    event => {

      const reason =

        event.reason;

      let message =

        "Erreur Promise inconnue";

      if (

        reason

      ) {

        if (

          reason.name ||

          reason.message

        ) {

          message =

            `${reason.name || "Error"} / ${reason.message || reason}`;

        } else {

          message =

            String(reason);

        }

      }

      debugLogger.log(

        `PROMISE REJETÉE : ${message}`,

        "error"

      );

    }

  );

</script>

</body>
