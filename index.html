<!doctype html>
<html lang="fr">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Astra</title><style>html,body{margin:0;background:#000;width:100%;height:100%;overflow:hidden}</style></head>
<body>
<script>
(async function () {
  try {
    const response = await fetch('astra-core.html?v=20260929-banner', { cache: 'no-store' });
    if (!response.ok) throw new Error('HTTP ' + response.status);
    let html = await response.text();
    const overlayScript = `
<script>
(function () {
  const unlockedMessages = {
    fr: 'ASTRA ARCHIVE TOUS VOS PARCHEMINS.',
    en: 'ASTRA ARCHIVES ALL YOUR SCROLLS.',
    de: 'ASTRA ARCHIVIERT ALLE EURE SCHRIFTROLLEN.'
  };

  function updateUnlockedBanner() {
    if (!document.body || !document.body.classList.contains('passwordFound')) return;
    const bandeau = document.getElementById('bandeau');
    if (!bandeau) return;
    const span = bandeau.querySelector('span');
    const lang = (typeof state !== 'undefined' && state.currentLang) ? state.currentLang : 'fr';
    if (span) span.textContent = unlockedMessages[lang] || unlockedMessages.fr;
    bandeau.style.setProperty('display', 'block', 'important');
  }

  const observer = new MutationObserver(updateUnlockedBanner);
  observer.observe(document.body, { attributes: true, attributeFilter: ['class'] });
  updateUnlockedBanner();
})();
<\/script>`;
    html = html.replace('</body>', overlayScript + '\n</body>');
    document.open();
    document.write(html);
    document.close();
  } catch (err) {
    document.body.innerHTML = '<div style="color:white;font-family:sans-serif;padding:24px">Erreur de chargement Astra. Rechargez la page.</div>';
    console.error(err);
  }
})();
</script>
</body>
</html>
