<!DOCTYPE html>

<html lang="fr">

<head>

  <meta charset="UTF-8" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="mobile-web-app-capable" content="yes" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
  />

  <title>
    Astra – Assistante de M. Morpheus
  </title>

  <style>

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      overflow: hidden;
      width: 100%;
      height: 100%;
      background: #000;
    }

    html, body, button, #staffTapZone {
      -webkit-user-select: none;
      user-select: none;
      -webkit-touch-callout: none;
    }

    body {
      min-height: 100vh;
      min-height: -webkit-fill-available;
      touch-action: manipulation;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: 'Unica One', serif;

      /*
       L'interface est affichée en miroir.
      */
      transform: scaleX(-1);
    }

    /* ======================================================
       VIDÉOS ASTRA
       ====================================================== */

    video {
      position: absolute;
      top: 50%;
      left: 50%;

      width: 95%;
      height: auto;

      transform: translate(-50%, -50%);

      object-fit: contain;

      background: #000;

      opacity: 0;

      transition:
        opacity 0.6s ease;

      display: none;
    }

    #astraIdle.active,
    #astraIdle2.active {
      display: block;
      opacity: 1;
      z-index: 1;
    }

    #astraReaction {
      display: none;
      z-index: 2;
    }

    /* Vidéo indice chaudron : taille proche des animations Astra habituelles */
    #astraReaction.cauldron-hint {
      width: auto;
      height: auto;
      max-width: 130vw;
      max-height: 130vh;
      object-fit: contain;
    }

    /* ======================================================
       BANDEAU
       ====================================================== */

    #bandeau {
      position: fixed;

      bottom: 8%;
      width: 100%;

      background: transparent;

      color:
        rgba(
          0,
          255,
          220,
          0.85
        );

      font-size:
        clamp(
          1.2rem,
          3vw,
          2.2rem
        );

      text-align: center;

      padding:
        0 5%;

      text-shadow:
        0 0 15px
          rgba(
            0,
            255,
            200,
            0.8
          ),

        0 0 30px
          rgba(
            0,
            255,
            200,
            0.4
          );

      letter-spacing: 2px;

      /* Sécurité visuelle : le bandeau reste TOUJOURS en majuscules. */
      text-transform: uppercase;

      z-index: 3;

      animation:
        bandeauPulse
        4s
        ease-in-out
        infinite;

      pointer-events: none;
    }

    #bandeau span {
      display: block;
      white-space: normal;
    }

    @keyframes bandeauPulse {

      0%,
      100% {
        opacity: 0.35;
      }

      50% {
        opacity: 0.9;
      }

    }

    /* ======================================================
       PARCHEMIN VIDÉO
       ====================================================== */

    #parcheminImage {

      position: fixed;

      top: 50%;
      left: 50%;

      /* Le body est déjà inversé pour le Pepper's Ghost.
         Ne pas ajouter scaleX(-1) ici : cela annulerait le miroir du parchemin. */
      transform: translate(-50%, -50%);

      width: 100vw;
      height: 100vh;
      max-width: none;
      max-height: none;

      object-fit: contain;

      z-index: 4;

      display: none;

      opacity: 0;

      transition:
        opacity 0.5s ease;

      background: transparent;
    }

    #parcheminImage.visible {
      opacity: 1;
    }

    /* ======================================================
       PARTICULES MAGIQUES
       ====================================================== */

    .magic {

      position: absolute;

      width: 26px;
      height: 26px;

      border-radius: 50%;

      background:

        radial-gradient(

          circle,

          rgba(
            0,
            255,
            255,
            0.8
          )
          0%,

          rgba(
            0,
            255,
            150,
            0.25
          )
          40%,

          rgba(
            0,
            100,
            100,
            0.1
          )
          65%,

          transparent
          85%

        );

      filter:
        blur(3px)
        brightness(2.2);

      mix-blend-mode:
        screen;

      animation:
        fallMagic
        6s
        ease-in-out
        forwards;

      pointer-events:
        none;

      z-index: 5;
    }

    @keyframes fallMagic {

      0% {

        transform:
          translateY(-600px)
          scale(1.3)
          rotate(0deg);

        opacity: 0;

      }

      20% {

        opacity: 1;

      }

      60% {

        transform:
          translateY(0px)
          scale(0.8)
          rotate(180deg);

        opacity: 0.9;

      }

      100% {

        transform:
          translateY(400px)
          scale(0.6)
          rotate(360deg);

        opacity: 0;

      }

    }
        /* ======================================================
       TRANSITION MAGIQUE
       ====================================================== */

    #transitionFade {

      position: fixed;

      inset: 0;

      background:
        radial-gradient(
          circle at center,
          rgba(0, 255, 255, 0.9) 0%,
          rgba(0, 255, 150, 0.4) 30%,
          rgba(0, 100, 100, 0.2) 55%,
          transparent 75%
        );

      opacity: 0;

      pointer-events: none;

      transition:
        opacity
        1.2s
        ease;

      z-index: 9;
    }


    /* ======================================================
       INTERFACE STAFF
       ====================================================== */

    #fullscreenBtn,
    #statusIndicator,
    #languageSelector,
    #debugToggle,
    #debugPanel {

      display:
        none !important;

    }

    body.staffMode
    #fullscreenBtn,

    body.staffMode
    #statusIndicator,

    body.staffMode
    #languageSelector,

    body.staffMode
    #debugToggle {

      display:
        flex !important;

    }

    body.staffMode
    #debugPanel.visible {

      display:
        block !important;

    }


    /* ======================================================
       PLEIN ÉCRAN
       ====================================================== */

    #fullscreenBtn {

      position: fixed;

      bottom: 20px;
      right: 25px;

      z-index: 10;

      width: 50px;
      height: 50px;

      border:
        2px solid
        rgba(255, 255, 255, 0.3);

      border-radius: 50%;

      color: #fff;

      font-size: 22px;

      text-align: center;

      line-height: 46px;

      cursor: pointer;

      background:
        rgba(255, 255, 255, 0.08);

      transition:
        all
        0.3s
        ease;

      user-select: none;

      transform:
        scaleX(-1);

    }

    #fullscreenBtn:hover {

      background:
        rgba(255, 255, 255, 0.2);

      border-color:
        rgba(255, 255, 255, 0.6);

      transform:
        scaleX(-1)
        scale(1.1);

    }


    /* ======================================================
       STATUT
       ====================================================== */

    #statusIndicator {

      position: fixed;

      top: 20px;
      right: 25px;

      z-index: 10;

      align-items: center;

      gap: 10px;

      padding:
        10px 15px;

      background:
        rgba(0, 0, 0, 0.5);

      border-radius: 20px;

      color: #fff;

      font-size: 14px;

      opacity: 0;

      transition:
        opacity
        0.3s
        ease;

      transform:
        scaleX(-1);

    }

    #statusIndicator.visible {
      opacity: 1;
    }

    .status-dot {

      width: 10px;
      height: 10px;

      border-radius: 50%;

      background: #ff4444;

      animation:
        pulse
        2s
        infinite;

    }

    .status-dot.listening {

      background: #44ff44;

    }

    @keyframes pulse {

      0%,
      100% {

        opacity: 1;

      }

      50% {

        opacity: 0.5;

      }

    }


    /* ======================================================
       ERREURS
       ====================================================== */

    #errorMessage {

      position: fixed;

      top: 50%;
      left: 50%;

      transform:
        translate(-50%, -50%)
        scaleX(-1);

      background:
        rgba(255, 50, 50, 0.9);

      color: white;

      padding:
        20px 40px;

      border-radius: 10px;

      z-index: 11;

      display: none;

      text-align: center;

      max-width: 80%;

    }


    /* ======================================================
       DEBUG
       ====================================================== */

    #debugPanel {

      position: fixed;

      bottom: 80px;
      left: 20px;

      background:
        rgba(0, 0, 0, 0.9);

      color: #0f0;

      padding: 15px;

      border-radius: 10px;

      font-family: monospace;

      font-size: 12px;

      max-width: 500px;
      max-height: 350px;

      overflow-y: auto;

      z-index: 12;

      transform:
        scaleX(-1);

    }

    #debugToggle {

      position: fixed;

      bottom: 80px;
      left: 20px;

      z-index: 13;

      padding:
        8px 16px;

      background:
        rgba(0, 255, 0, 0.2);

      border:
        2px solid
        rgba(0, 255, 0, 0.5);

      border-radius: 20px;

      color: #0f0;

      cursor: pointer;

      font-size: 12px;

      transform:
        scaleX(-1);

    }


    /* ======================================================
       LANGUES
       ====================================================== */

    #languageSelector {

      position: fixed;

      top: 20px;
      left: 25px;

      z-index: 10;

      gap: 10px;

      transform:
        scaleX(-1);

    }

    .lang-btn {

      padding:
        8px 16px;

      background:
        rgba(255, 255, 255, 0.1);

      border:
        2px solid
        rgba(255, 255, 255, 0.3);

      border-radius: 20px;

      color: #fff;

      cursor: pointer;

      transition:
        all
        0.3s
        ease;

      font-size: 14px;

    }

    .lang-btn:hover {

      background:
        rgba(255, 255, 255, 0.2);

      border-color:
        rgba(255, 255, 255, 0.5);

    }

    .lang-btn.active {

      background:
        rgba(0, 255, 255, 0.3);

      border-color:
        rgba(0, 255, 255, 0.7);

    }


    /* ======================================================
       ZONE STAFF INVISIBLE
       ====================================================== */

    #staffTapZone {

      position: fixed;

      top: 0;
      left: 0;

      width: 80px;
      height: 80px;

      z-index: 20;

    }



    /* MODE PLEIN ECRAN JOUEURS : uniquement Astra / parchemin */
    :fullscreen #fullscreenBtn,
    :fullscreen #statusIndicator,
    :fullscreen #languageSelector,
    :fullscreen #debugToggle,
    :fullscreen #debugPanel,
    :fullscreen #staffTapZone,
    :-webkit-full-screen #fullscreenBtn,
    :-webkit-full-screen #statusIndicator,
    :-webkit-full-screen #languageSelector,
    :-webkit-full-screen #debugToggle,
    :-webkit-full-screen #debugPanel,
    :-webkit-full-screen #staffTapZone {
      display: none !important;
    }

  
    /* ======================================================
       ÉCRAN DE LANCEMENT GM — choix langue
       ====================================================== */
    #launchScreen {
      position: fixed;
      inset: 0;
      z-index: 100;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 28px;
      background: #000;
      transform: scaleX(-1); /* annule le miroir global pour le GM */
      color: rgba(0,255,220,.95);
      font-family: 'Unica One', serif;
      text-align: center;
    }

    #launchScreen.hidden { display: none !important; }

    #launchScreen .launchTitle {
      font-size: clamp(1.6rem, 5vw, 3rem);
      letter-spacing: 3px;
      text-shadow: 0 0 18px rgba(0,255,220,.65);
    }

    #launchScreen .launchLanguages {
      display: flex;
      gap: 18px;
      flex-wrap: wrap;
      justify-content: center;
    }

    #launchScreen .launchLang {
      min-width: 120px;
      padding: 18px 24px;
      border: 2px solid rgba(0,255,220,.65);
      border-radius: 18px;
      background: rgba(0,255,220,.10);
      color: white;
      font-size: 1.25rem;
      cursor: pointer;
    }

    /* En jeu, les contrôles GM restent cachés.
       5 taps en haut à gauche = mode staff de secours. */
    body:not(.staffMode) #fullscreenBtn,
    body:not(.staffMode) #statusIndicator,
    body:not(.staffMode) #languageSelector,
    body:not(.staffMode) #debugToggle,
    body:not(.staffMode) #debugPanel {
      display: none !important;
    }

  

    /* Message mot de passe : visible uniquement tant que le mot de passe n'est pas validé. */
    body:not(.passwordFound):fullscreen #bandeau,
    body:not(.passwordFound):-webkit-full-screen #bandeau {
      display: block !important;
    }

    body.passwordFound #bandeau,
    body.passwordFound:fullscreen #bandeau,
    body.passwordFound:-webkit-full-screen #bandeau {
      display: none !important;
    }

    body.projecting #fullscreenBtn,
    body.projecting #statusIndicator,
    body.projecting #languageSelector,
    body.projecting #debugToggle,
    body.projecting #debugPanel,
    body.projecting #errorMessage,
    body.projecting #launchScreen { display: none !important; }
    body.projecting #staffTapZone {
      display: block !important; background: transparent !important;
      border: 0 !important; outline: 0 !important; opacity: 0;
      -webkit-tap-highlight-color: transparent;
    }
    #launchDiagnostics { max-width: 85vw; color: #ddd; font-family: sans-serif; }
    #launchDiagnostics summary { cursor: pointer; }
    #phraseHistory { max-height: 28vh; overflow: auto; text-align: left; font-size: 14px; }
    #launchDiagnostics button { margin-top: 10px; padding: 8px; }
  </style>

</head>

<script>

  /*
   ============================================================
   ASTRA — VERSION iPad / Safari
   ============================================================
  */


  // ==========================================================
  // ÉLÉMENTS DOM
  // ==========================================================

  const elements = {

    bandeau:
      document.getElementById(
        "bandeau"
      ),

    parcheminImage:
      document.getElementById(
        "parcheminImage"
      ),

    astraIdle:

        "astraIdle2"
      ),

    astraReaction:
      document.getElementById(
        "astraReaction"
      ),

    fullscreenBtn:
      document.getElementById(
        "fullscreenBtn"
      ),

    fade:
      document.getElementById(
        "transitionFade"
      ),

    statusIndicator:
      document.getElementById(
        "statusIndicator"
      ),

    statusText:
      document.getElementById(
        "statusText"
      ),

    statusDot:
      document.querySelector(
        ".status-dot"
      ),

    errorMessage:
      document.getElementById(
        "errorMessage"
      ),

    languageSelector:
      document.getElementById(
        "languageSelector"
      ),

    debugPanel:
      document.getElementById(
        "debugPanel"
      ),

    debugToggle:
      document.getElementById(
        "debugToggle"
      ),

    staffTapZone:
      document.getElementById(
        "staffTapZone"
      )

  };


  // ==========================================================
  // ÉTAT GLOBAL
  // ==========================================================

  const state = {

    mdpValid: false,

    /*
     IMPORTANT :
     Astra écoute techniquement le micro,
     mais elle ignore absolument tout
     tant que le bon mot de passe n'a pas été prononcé.
    */
    awake: false,

    isPlaying: false,

    recognition: null,

    currentLang: "fr",

    manualStop: false,

    needsGestureRestart: false,

    started: false,

    recognitionRunning: false,

    // Timer de secours : montre le chaudron après 5 min sans mot de passe
    passwordHintTimer: null

  };
    // ==========================================================
  // DEBUG
  // ==========================================================

  const debugLogger = {

    logs: [],

    log(
      message,
      type = "info"
    ) {

      const timestamp =
        new Date()
          .toLocaleTimeString();

      const logEntry =
        `[${timestamp}] ${type.toUpperCase()}: ${message}`;

      this.logs.push(
        logEntry
      );

      if (
        this.logs.length > 100
      ) {

        this.logs.shift();

      }

      console.log(
        logEntry
      );

      this.update();

    },


    update() {

      if (
        !elements.debugPanel
      ) {

        return;

      }

      if (!elements.debugPanel.classList.contains('visible')) return;
      elements.debugPanel.textContent = this.logs.join('\n');
      elements.debugPanel.style.whiteSpace = 'pre-wrap';

      elements.debugPanel.scrollTop =

        elements.debugPanel
          .scrollHeight;

    },


    clear() {

      this.logs = [];

      this.update();

    }

  };


  elements.debugToggle
    .addEventListener(

      "click",

      () => {

        elements.debugPanel
          .classList
          .toggle(
            "visible"
          );

      }

    );

  // ==========================================================

  // ==========================================================

  // ==========================================================

const PARCHEMIN_VIDEO = {

  en:

  de:

  // ==========================================================
  // FICHIERS AUDIO MULTILINGUES
  // ==========================================================

  const audioFiles = {

    // ========================================================
    // FRANÇAIS
    // ========================================================

    // --------------------------------------------------------
    // Joue une animation de réaction
    // --------------------------------------------------------

    playReaction(
      videoName
    ) {
      elements.astraIdle.pause();
      elements.astraIdle2.pause();

      debugLogger.log(
        `Vidéo réaction : ${videoName}`,
        "video"
      );


      elements.astraReaction.classList.toggle(
        "cauldron-hint",
        videoName === VIDEO.cauldronHint
      );

      elements.astraReaction.src =
        videoName;

      elements.astraReaction.style.display =
        "block";


      elements.astraIdle.style.opacity =
        "0.3";

      elements.astraIdle2.style.opacity =
        "0.3";


      elements.astraReaction.style.opacity =
        "1";

      elements.astraReaction.currentTime =
        0;

      elements.astraReaction.muted =
        true;


      return elements.astraReaction
        .play()

        .catch(
          err => {

            debugLogger.log(
              `Vidéo réaction refusée : ${err.message}`,
              "warn"
            );
            return false;

          }
        );

    },


    // --------------------------------------------------------
    // Joue une réaction SANS audio (utilisé pour l'indice 5 min)
    // --------------------------------------------------------

    standaloneCleanup: null,
    playStandaloneReaction(videoName) {
      if (state.isPlaying || state.mdpValid) return;
      state.isPlaying = true;
      const reaction = elements.astraReaction;
      let finished = false, timer = null;
      const cleanup = () => {
        clearTimeout(timer);
        reaction.onended = reaction.onerror = reaction.onplaying = reaction.onwaiting = null;
        this.standaloneCleanup = null;
      };
      const finish = () => {
        if (finished) return;
        finished = true;
        cleanup();
        this.endReaction();
      };
      this.standaloneCleanup = cleanup;
      const guard = () => {
        clearTimeout(timer);
        timer = setTimeout(finish, 20000);
      };
      reaction.onended = finish;
      reaction.onerror = finish;
      reaction.onwaiting = guard;
      reaction.onplaying = () => {
        clearTimeout(timer);
        // Secours basé sur la durée, y compris si ended n'arrive pas.
        const seconds = Number.isFinite(reaction.duration) ? Math.max(0, reaction.duration - reaction.currentTime) + 5 : 120;
        timer = setTimeout(finish, seconds * 1000);
      };
      guard();
      this.playReaction(videoName).then(ok => { if (ok === false) finish(); }).catch(finish);
    },


    // --------------------------------------------------------
    // Termine une réaction et retourne en IDLE
    // --------------------------------------------------------

    endReaction() {
      elements.astraReaction.pause();
      if (parcheminManager.active) return;

      elements.astraReaction.style.opacity =
        "0";


      setTimeout(
        () => {

          elements.astraReaction.style.display =
            "none";

          // Remet la taille normale après un éventuel indice chaudron.
          elements.astraReaction.style.width = "";
          elements.astraReaction.style.height = "";
          elements.astraReaction.style.maxWidth = "";
          elements.astraReaction.style.maxHeight = "";
          elements.astraReaction.style.objectFit = "";


          const activeIdle =

            state.mdpValid

              ? elements.astraIdle2

              : elements.astraIdle;


          activeIdle.style.opacity =
            "1";


          this.activateIdle(
            activeIdle
          );


          state.isPlaying =
            false;

        },
        300
      );

    }

  };


  // ==========================================================
  // PARCHEMIN
  // ==========================================================
  //
  // IMPORTANT :
  // Il ne doit exister QU'UN SEUL parcheminManager.
  //
  // Le parchemin est maintenant une VIDÉO :
  //
  // FR → parchemin_fr.mp4
  // EN → parchemin_en.mp4
  // DE → parchemin_de.mp4
  //
  // ==========================================================
const parcheminManager = {
  videos: { fr: "parchemin_fr.mp4", en: "parchemin_en.mp4", de: "parchemin_de.mp4" },
  active: false,
  videoDone: false,
  audioDone: false,
  timer: null,
  prepare() {
    if (this.active) return;
    const video = elements.parcheminImage;
    const file = this.videos[state.currentLang] || this.videos.fr;
    if (video.getAttribute('src') !== file) {
      video.src = file;
      video.preload = 'auto';
      video.load();
    }
  },
  show() {
    this.prepare();
    this.active = true;
    this.videoDone = false;
    this.audioDone = false;
    [elements.astraIdle, elements.astraIdle2, elements.astraReaction].forEach(v => {
      v.pause(); v.style.display = 'none'; v.classList.remove('active');
    });
    document.querySelectorAll('.magic').forEach(p => p.remove());
    const video = elements.parcheminImage;
    video.style.display = 'block';
    video.classList.add('visible');
    video.muted = true;
    video.currentTime = 0;
    // Si le MP3 est plus long, conserver la dernière image jusqu'à sa fin.
    video.onended = () => { this.videoDone = true; this.finishIfReady(); };
    video.onerror = () => this.fail();
    clearTimeout(this.timer);
    this.timer = setTimeout(() => this.fail(), 20000);
    video.onplaying = () => { clearTimeout(this.timer); };
    video.onwaiting = () => {
      clearTimeout(this.timer);
      this.timer = setTimeout(() => this.fail(), 20000);
    };
    video.play().catch(() => this.fail());
  },
  fail() {
    if (!this.active) return;
    debugLogger.log('Parchemin indisponible ou lecture bloquée', 'error');
    utils.showError('Parchemin indisponible', 3000);
    this.videoDone = true;
    this.finishIfReady();
  },
  finishIfReady() {
    if (this.active && this.videoDone && this.audioDone) {
      this.hide();
      videoManager.endReaction();
    }
  },
  hide() {
    clearTimeout(this.timer);
    const video = elements.parcheminImage;
    video.onended = video.onerror = video.onplaying = video.onwaiting = null;
    video.pause();
    video.classList.remove('visible');
    video.style.display = 'none';
    this.active = false;
  }
};

    // ==========================================================
  // PRÉCHARGEMENT AUDIO
  // ==========================================================

  /*
   On demande à Safari de charger les fichiers audio
   le plus tôt possible.

   Ça permet de réduire le délai entre :
   → la phrase reconnue
   → la réponse d'Astra
  */

  const audioPreloader = {
    cache: [],
    timer: null,
    generation: 0,
    preloadAll() {
      const generation = ++this.generation;
      clearTimeout(this.timer);
      this.cache.forEach(a => {
        a.onloadeddata = a.onerror = null;
        a.pause(); a.removeAttribute('src'); a.load();
      });
      this.cache = [];
      const files = audioFiles[state.currentLang];
      const priority = ['bonjour', 'mdp', 'notif', 'parchemin', 'indice_aide', 'mdp_oublie'];
      const queue = [...new Set([...priority.map(k => files[k]), ...Object.values(files).flat()])];
      // Un seul MP3 de fond à la fois ; la réponse en cours reste prioritaire.
      const next = () => {
        if (generation !== this.generation || !queue.length) return;
        if (state.isPlaying || document.visibilityState === 'hidden') {
          this.timer = setTimeout(next, 500);
          return;
        }
        const audio = new Audio();
        this.cache.push(audio);
        let done = false;
        const advance = () => {
          if (done || generation !== this.generation) return;
          done = true;
          audio.onloadeddata = audio.onerror = null;
          clearTimeout(this.timer);
          this.timer = setTimeout(next, 150);
        };
        audio.onloadeddata = audio.onerror = advance;
        audio.preload = 'auto';
        audio.src = queue.shift();
        this.timer = setTimeout(advance, 5000);
        audio.load();
      };
      parcheminManager.prepare();
      next();
    }
  };

  // ==========================================================
  // GESTION AUDIO
  // ==========================================================

  /*
   IMPORTANT POUR L'IPAD :

   On garde toujours les mêmes lecteurs Audio.

   currentAudio
      = voix d'Astra

   thinkingAudio
      = biprobotic.mp3


   Fonctionnement :

   phrase reconnue
        ↓
   bip robotique
        ↓
   attente 100 ms seulement
        ↓
   bip coupé
        ↓
   Astra répond
  */


  const audioManager = {

    // --------------------------------------------------------
    // Lecteur principal Astra
    // --------------------------------------------------------
// --------------------------------------------------------
// AMPLIFICATION DE LA VOIX D'ASTRA
// --------------------------------------------------------

audioContext: null,
gainNode: null,
audioSource: null,

voiceGain: 1.7,


initAmplifier() {
  if (this.audioContext) return;

  try {
    const AudioContext = window.AudioContext || window.webkitAudioContext;
    if (!AudioContext) {
      debugLogger.log("Web Audio indisponible — audio natif", "warn");
      return;
    }

    this.audioContext = new AudioContext();
    this.audioSource = this.audioContext.createMediaElementSource(this.currentAudio);
    this.gainNode = this.audioContext.createGain();
    this.gainNode.gain.value = this.voiceGain;
    this.audioSource.connect(this.gainNode);
    this.gainNode.connect(this.audioContext.destination);

    if (this.audioContext.state === "suspended") {
      this.audioContext.resume().catch(() => {});
    }

    debugLogger.log(`🔊 Amplification Astra x${this.voiceGain}`, "success");
  } catch (err) {
    debugLogger.log(`Amplification indisponible : ${err.message} — audio natif conservé`, "warn");
  }
},
    currentAudio:
      new Audio(),


    // --------------------------------------------------------
    // Lecteur du bip
    // --------------------------------------------------------

    thinkingAudio:
      new Audio(
        "biprobotic.mp3"
      ),


    unlocked:
      false,


    safetyTimeout:
      null,


    // ========================================================
    // DÉBLOCAGE AUDIO iOS
    // ========================================================

    unlock() {

      try {

        const audio =
          this.currentAudio;


        /*
         Petit fichier WAV silencieux.

         Il est joué lors du premier tap staff
         pour autoriser ensuite Safari à lire
         les fichiers audio.
        */

        audio.src =
          "data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YQAAAAA=";


        audio.volume =
          0.01;


        const promise =
          audio.play();


        if (
          promise &&
          promise.then
        ) {

          promise

            .then(
              () => {

                audio.pause();


                try {

                  audio.currentTime =
                    0;

                }

                catch (_) {}


                audio.volume =
                  1;


                this.unlocked =
                  true;


                debugLogger.log(
                  "✓ Audio principal débloqué sur iOS",
                  "success"
                );


                // Préparation du bip

                this.thinkingAudio.preload =
                  "auto";


                try {

                  this.thinkingAudio.load();

                }

                catch (_) {}

              }
            )


            .catch(
              err => {

                this.unlocked =
                  false;


                debugLogger.log(
                  `Échec unlock audio : ${err.name} / ${err.message}`,
                  "error"
                );

              }
            );

        }

        else {

          this.unlocked =
            true;

        }

      }

      catch (err) {

        this.unlocked =
          false;


        debugLogger.log(
          `Erreur unlock audio : ${err.message}`,
          "error"
        );

      }

      en: [

        ['indice_aide', /\b(help|hint|clue|stuck|cauldron)\b/]
      ],
      de: [
        ['repeat', /\b(wiederholen|wiederhole|noch einmal|nochmal|nicht gehort|nicht verstanden)\b/],

      const unknown = response && files.pas_compris.includes(response.file);
      const result = !response ? 'Sans réponse' : unknown ? 'Non reconnue' : response.file;
      this.entries.push({time: new Date().toLocaleString(), lang: state.currentLang, text: String(text).slice(0,500), result});
      this.entries = this.entries.slice(-100);
      try { localStorage.setItem(this.key, JSON.stringify(this.entries)); } catch (_) {}
    },
    render() {
      if (state.started) return;
      const target = document.getElementById('phraseHistory');
      target.textContent = '';
      if (!this.entries.length) { target.textContent = 'Aucune phrase enregistrée.'; return; }
      this.entries.slice().reverse().forEach(entry => {
        const row = document.createElement('p');
        row.textContent = `${entry.time} [${entry.lang}] ${entry.text} → ${entry.result}`;
        target.appendChild(row);
      });
    },

  // Préparation sans effet sur le jeu : ne jamais appeler detect() sur une phrase provisoire.
  const fastResponse = {
    timer: null,
    text: '',
    ended: false,
    consumed: false,
    blocked: false,
    cancel() { clearTimeout(this.timer); this.timer = null; },
    reset() {
      this.cancel(); this.text = ''; this.ended = false;
      this.consumed = false; this.blocked = false;
    },
    speechStart() {
      this.cancel(); this.ended = false;
      this.blocked = state.isPlaying;
    },
    speechEnd() { this.ended = true; this.schedule(); },
    preview(text) {
      const lang = state.currentLang, files = audioFiles[lang];
      const t = phraseDetector.normalize(text).replace(/['’\-]/g, ' ').replace(/\s+/g, ' ').trim();
      const expanded = expandedIntent(t, lang);
      if (expanded === 'ignore') return null;
      // Ces demandes sont seulement préchargées ; seule la phrase finale peut les valider.
      if (expanded === 'password') return { file: files.mdp, fast: false };
      if (expanded === 'scroll') return state.awake ? { file: files.parchemin, fast: false } : null;
      if (expanded === 'repeat') return state.lastResponse ? { file: state.lastResponse.file, fast: false } : null;
      const clean = t.replace(/^(?:astra\s+|s il te plait\s+|please\s+|bitte\s+)/, '')
        .replace(/\s+(?:astra|s il te plait|please|bitte)$/, '');
      // Phrases complètes uniquement : les autres attendent la confirmation finale.
      const rules = {
        fr: [
          ['bonjour', /^(?:bonjour|salut|coucou|bonsoir|hello)$/],
          ['indice_aide', /^(?:un indice|donne nous un indice|donne moi un indice|aide nous|aide moi|on est bloques?|on est coinces?)$/],
          ['qui', /^(?:qui es tu|tu es qui|comment tu t appelles)$/],
          ['ou', /^(?:on est ou|ou sommes nous|ou est on)$/],
          ['ca_va', /^(?:ca va|comment vas tu|comment tu vas|tu vas bien)$/],
          ['tu_es_la', /^(?:tu es la|tu m entends|tu nous entends)$/],
          ['faire_quoi_mtn', /^(?:on fait quoi|que faire maintenant|par ou commencer|quelle est la prochaine etape)$/],
          ['berceuse', /^(?:chante une berceuse|chante nous une berceuse|aide nous a dormir)$/]
        ],
        en: [
          ['bonjour', /^(?:hello|hi|good morning|good evening)$/],
          ['indice_aide', /^(?:help us|help me|give us a hint|give me a hint|we are stuck)$/],
          ['qui', /^who are you$/], ['ou', /^where are we$/], ['ca_va', /^how are you$/]
        ],
        de: [
          ['bonjour', /^(?:hallo|guten tag|guten morgen|guten abend)$/],
          ['indice_aide', /^(?:hilf uns|gib uns einen hinweis)$/],
          ['qui', /^wer bist du$/], ['ou', /^wo sind wir$/], ['ca_va', /^wie geht es dir$/]
        ]
      };
      const match = rules[lang].find(([, regex]) => regex.test(clean));
      if (match && (state.awake || ['bonjour', 'indice_aide', 'tu_es_la'].includes(match[0]))) {
        return {file: files[match[0]], fast: true};
      }
      if (expanded && files[expanded] && (state.awake || ['indice_aide', 'mdp_oublie', 'invite_mdp', 'tu_es_la'].includes(expanded))) {
        return {file: files[expanded], fast: false};
      }
      return null;
    },
    receive(text, final, confidence) {
      if (this.consumed || this.blocked) return;
      if (state.isPlaying) { this.blocked = true; this.cancel(); return; }
      this.text = text;
      this.cancel();
      if (final) { this.dispatch(text, confidence); return; }
      const candidate = this.preview(text);
      if (candidate) audioManager.prepare(candidate.file);
      this.schedule();
    },
    schedule() {
      this.cancel();
      if (!this.ended || this.consumed || this.blocked || state.isPlaying || !this.text) return;
      const candidate = this.preview(this.text);
      if (!candidate || !candidate.fast) return;
      const text = this.text, lang = state.currentLang;
      // Déclencher peu après la fin de parole signalée, sans attendre le résultat final.
      this.timer = setTimeout(() => {
        this.timer = null;
        if (this.consumed || this.blocked || state.isPlaying || lang !== state.currentLang || this.text !== text) return;
        this.dispatch(text, 0);
      }, 180);
    },
    dispatch(text, confidence) {
      this.cancel();
      if (this.consumed || this.blocked || state.isPlaying) return;
      this.consumed = true;
      state.lastSpeechConfidence = confidence;
      state.lastSpeechText = text;
      const response = phraseDetector.detect(text);
      phraseHistory.record(text, response);
      if (response && response.file) audioManager.play(response.file, response.video);
    },
    finishSession() {
      // Laisser une demande complète déjà entendue finir son délai avant la prochaine session.
      this.speechEnd();
    }
  };

    getLangCode() {

    init() {

      debugLogger.log(
        "✓ API SpeechRecognition disponible",

       On utilise volontairement des sessions courtes sur iPad.

       Le onend plus bas la relancera

      // Safari iPad est nettement plus stable en sessions courtes.
      // Le onend relance automatiquement l'écoute quand nécessaire.
      state.recognition.continuous = false;

       MODE RÉPONSE RAPIDE :
       Safari peut fournir une transcription intermédiaire avant le résultat final.
       On l'analyse immédiatement : les intentions connues peuvent donc déclencher
       Astra sans attendre la finalisation complète de la phrase.
       Les faux résultats restent filtrés par phraseDetector.
      */
      state.recognition.interimResults =
        true;


      state.recognition.maxAlternatives =
        1;


      state.recognition.lang =
        this.getLangCode();


      debugLogger.log(
        `Langue reconnaissance : ${state.recognition.lang}`,
        "info"

      // ======================================================
      // DÉMARRAGE EFFECTIF
      // ======================================================

      state.recognition.onstart =
        () => {

          fastResponse.reset();

          state.recognitionRunning =
            true;


          state.needsGestureRestart =
            false;


          debugLogger.log(
            "🎙️ Astra écoute",
            "success"

          utils.updateStatus(
            "listening",
            true
          );

        };


      // ======================================================
      // VOIX DÉTECTÉE
      // ======================================================

      state.recognition.onspeechstart =
        () => {
          fastResponse.speechStart();

          debugLogger.log(
            "🎙️ Voix détectée",
            "speech"
          );

        };


      state.recognition.onspeechend =
        () => {
          fastResponse.speechEnd();

          debugLogger.log(
            "Fin de phrase détectée",
            "speech"

      // ======================================================
      // RÉSULTAT VOCAL
      // ======================================================

      state.recognition.onresult = event => {
        try {
          const result = event.results[event.results.length - 1];
          if (!result || !result[0]) return;
          fastResponse.receive(result[0].transcript.trim(), result.isFinal,
            typeof result[0].confidence === 'number' ? result[0].confidence : 0);
        } catch (err) {
          debugLogger.log('Erreur résultat vocal : ' + err.message, 'error');
        }
      };


      // ======================================================
      // ERREURS SPEECH RECOGNITION
      // ======================================================

      state.recognition.onerror =
        event => {          fastResponse.cancel();
          fastResponse.blocked = true;
          const error =
            event.error ||
            "inconnue";


          debugLogger.log(
            `Erreur reconnaissance : ${error}`,
            "error"
          );


          // --------------------------------------------------
          // AUCUNE PAROLE
          // --------------------------------------------------

          if (
            error === "no-speech"
          ) {

            debugLogger.log(
              "Pas de parole détectée",
              "info"
            );

            return;

          }


          // --------------------------------------------------
          // ARRÊT VOLONTAIRE
          // --------------------------------------------------

          if (
            error === "aborted"
          ) {

            debugLogger.log(
              "Reconnaissance interrompue",
              "info"
            );

            return;

          }


          // --------------------------------------------------
          // SAFARI DEMANDE UN NOUVEAU GESTE
          // --------------------------------------------------

          if (
            error === "not-allowed"
          ) {

            state.needsGestureRestart =
              true;


            debugLogger.log(
              "⚠️ Safari demande un nouveau tap pour relancer le micro",
              "warn"
            );


            utils.updateStatus(
              "micDisabled",
              false
            );

            return;

          }


          // --------------------------------------------------
          // MICRO INDISPONIBLE
          // --------------------------------------------------

          if (
            error === "audio-capture"
          ) {

            debugLogger.log(
              "Microphone indisponible",
              "error"
            );


            utils.updateStatus(
              "micError",
              false
            );

            return;

          }


          // --------------------------------------------------
          // ERREUR RÉSEAU
          // --------------------------------------------------

          if (
            error === "network"
          ) {

            debugLogger.log(
              "Erreur réseau SpeechRecognition",
              "error"
            );


            utils.updateStatus(
              "micError",
              false
            );

            return;

          }


          // --------------------------------------------------
          // AUTRE ERREUR
          // --------------------------------------------------

          utils.updateStatus(
            "micError",
            false
          );

        };


      // ======================================================
      // FIN DE RECONNAISSANCE
      // ======================================================

      state.recognition.onend =
        () => {

          fastResponse.finishSession();
          state.recognitionStarting = false;
          state.recognitionRunning =
            false;


          debugLogger.log(
            "Reconnaissance arrêtée",
            "info"
          );


          // --------------------------------------------------
          // CHANGEMENT DE LANGUE
          // --------------------------------------------------

          /*
           Si l'arrêt vient du changement
           de langue, languageManager
           s'occupe lui-même du redémarrage.
          */

          if (
            state.manualStop
          ) {

            state.manualStop =
              false;

            return;

          }


          // --------------------------------------------------
          // SAFARI ATTEND UN TAP
          // --------------------------------------------------

          if (
            state.needsGestureRestart
          ) {

            debugLogger.log(
              "En attente d'un tap écran",
              "warn"
            );

            return;

          }


          // --------------------------------------------------
          // ASTRA PAS ENCORE DÉMARRÉE
          // --------------------------------------------------

          if (
            !state.started
          ) {

            return;

          }


          // --------------------------------------------------
          // REDÉMARRAGE AUTOMATIQUE
          // --------------------------------------------------

          /*
           Safari coupe parfois la reconnaissance
           sans raison apparente.

           On la relance après 500 ms.
          */

          setTimeout(
            () => {

              if (
                !state.started ||
                state.needsGestureRestart
              ) {

                return;

              }


              this.start();

            },

            350
          );

        };


      return true;

    },


    // ========================================================
    // CHANGEMENT DE LANGUE MICRO
    // ========================================================

    updateLanguage() {

      if (
        !state.recognition
      ) {

        return;

      }


      state.recognition.lang =
        this.getLangCode();


      debugLogger.log(
        `Nouvelle langue micro : ${state.recognition.lang}`,
        "info"
      );

    },


    // ========================================================
    // DÉMARRAGE RECONNAISSANCE
    // ========================================================

    start() {

      if (
        !state.recognition
      ) {

        return;

      }


      /*
       Évite d'envoyer plusieurs start()
       simultanément à Safari.
      */

      if (
        state.recognitionRunning || state.recognitionStarting
      ) {

        return;

      }


      try {

        state.recognitionStarting = true;
        state.recognition.start();


        debugLogger.log(
          "recognition.start() envoyé",
          "info"
        );

      }

      catch (err) {
        state.recognitionStarting = false;


        // ----------------------------------------------------
        // SAFARI PENSE QUE LE MICRO TOURNE ENCORE
        // ----------------------------------------------------

        if (
          err.name ===
          "InvalidStateError"
        ) {

          debugLogger.log(
            "Reconnaissance déjà active selon Safari",
            "info"
          );

          return;

        }


        // ----------------------------------------------------
        // AUTRE ERREUR
        // ----------------------------------------------------

        debugLogger.log(
          `Erreur start : ${err.name} / ${err.message}`,
          "error"
        );


        state.needsGestureRestart =
          true;

      }

    }

  };


  // ==========================================================
  // FIN PARTIE 7
  // ==========================================================

    // ==========================================================
  // APPLICATION
  // ==========================================================

  const app = {

    initialized: false,


    init() {

      if (
        this.initialized
      ) {

        return;

      }


      this.initialized = true;


      try {

        debugLogger.log(
          "Initialisation Astra...",
          "info"
        );


        // ====================================================
        // VIDÉOS
        // ====================================================

        videoManager.setupLoops();


        videoManager.activateIdle(
          elements.astraIdle
        );


        // ====================================================
        // LANGUES
        // ====================================================

        languageManager.init();


        // ====================================================
        // RECONNAISSANCE VOCALE
        // ====================================================

        if (
          speechRecognition.init()
        ) {

          speechRecognition.start();


          utils.updateStatus(
            "ready",
            true
          );


          utils.hideStatus(
            3000
          );


          debugLogger.log(
            "★★★★★ ASTRA EST PRÊTE ★★★★★",
            "success"
          );


          debugLogger.log(
            "💤 Astra est en veille : elle attend d'être saluée",
            "info"
          );

        }

        else {

          utils.showError(
            translations[
              state.currentLang
            ].errorSpeechNotAvailable,
            5000
          );

        }

      }

      catch (err) {

        debugLogger.log(
          `ERREUR INITIALISATION : ${err.message}`,
          "error"
        );


        utils.showError(
          translations[
            state.currentLang
          ].errorMicDenied,
          5000
        );

      }

    }

  };



  // ==========================================================
  // DÉMARRAGE iPAD DEPUIS UN VRAI GESTE UTILISATEUR
  // ==========================================================
  const passwordHint = {
    schedule(delay = 5 * 60 * 1000) {
      clearTimeout(state.passwordHintTimer);
      state.passwordHintTimer = setTimeout(() => this.tryShow(), delay);
    },
    tryShow() {
      state.passwordHintTimer = null;
      if (!state.started || state.mdpValid || state.awake) return;
      if (state.isPlaying || document.visibilityState === 'hidden') {
        this.schedule(1000);
        return;
      }
      videoManager.playStandaloneReaction(VIDEO.cauldronHint);
    }
  };

  function startAstraFromUserGesture() {

    if (state.started) {
      if (state.needsGestureRestart) {
        state.needsGestureRestart = false;
        audioManager.unlock();
        if (state.recognition) {
          speechRecognition.start();
        }
      }
      return;
    }

    state.started = true;
    document.body.classList.remove('staffMode');
    document.body.classList.add('projecting');
  audioPreloader.preloadAll();
    state.awake = false;

    debugLogger.log("👆 Démarrage Astra depuis le geste GM", "success");
    debugLogger.log("🔒 Astra attend maintenant le mot de passe", "info");

    // IMPORTANT iPadOS / Safari : AudioContext + play() doivent être
    // déclenchés directement par le vrai clic/touch du GM.
    audioManager.initAmplifier();
    audioManager.unlock();

    // Débloque le bip dans le même geste.
    try {
      const bip = audioManager.thinkingAudio;
      bip.volume = 0.01;
      const bipUnlock = bip.play();

      if (bipUnlock && bipUnlock.then) {
        bipUnlock
          .then(() => {
            bip.pause();
            try { bip.currentTime = 0; } catch (_) {}
            bip.volume = 1;
            debugLogger.log("✓ Lecteur bip débloqué", "success");
          })
          .catch(err => {
            bip.volume = 1;
            debugLogger.log(`Unlock bip refusé : ${err.message}`, "warn");
          });
      } else {
        try { bip.pause(); bip.currentTime = 0; } catch (_) {}
        bip.volume = 1;
      }
    } catch (err) {
      debugLogger.log(`Erreur unlock bip : ${err.message}`, "warn");
    }

    // Lance aussi l'idle depuis le geste utilisateur.
    try {
      elements.astraIdle.muted = true;
      elements.astraIdle.style.display = "block";
      elements.astraIdle.classList.add("active");
      const idlePromise = elements.astraIdle.play();
      if (idlePromise && idlePromise.catch) idlePromise.catch(() => {});
    } catch (_) {}

    // Initialisation micro / logique Astra.
    app.init();

    passwordHint.schedule();
  }


  // ==========================================================
  // LANCEMENT GM : LANGUE → DÉMARRAGE IMMÉDIAT
  // ==========================================================
  document.querySelectorAll("[data-launch-lang]").forEach(btn => {
    btn.addEventListener("click", () => {
      const lang = btn.dataset.launchLang || "fr";

      // Choix langue avant le démarrage.
      state.currentLang = lang;
      utils.updateBandeau();

      document.querySelectorAll(".lang-btn").forEach(b => {
        b.classList.toggle("active", b.dataset.lang === lang);
      });

      // Le clic du GM EST le geste iOS pour audio + micro.
      // Un .click() synthétique peut perdre l'autorisation utilisateur sur Safari.
      startAstraFromUserGesture();

      // Tentative plein écran navigateur quand l'API le permet.
      const root = document.documentElement;
      const requestFS = root.requestFullscreen || root.webkitRequestFullscreen;
      if (requestFS) {
        try {
          const p = requestFS.call(root);
          if (p && p.catch) p.catch(() => {});
        } catch (_) {}
      }

      document.getElementById("launchScreen").classList.add("hidden");
    });
  });

  // Cinq taps dans le coin supérieur DROIT de l'écran physique (body en miroir).
  // Aucun panneau ne s'ouvre pendant la projection, même sans plein écran.
  let staffTapCount = 0;
  let staffTapTimer = null;
  function restartListeningFromGesture() {
    if (!state.started) return;
    fastResponse.reset();
    const previous = state.recognition;
    if (previous) {
      previous.onstart = previous.onend = previous.onerror = previous.onresult = null;
      previous.onspeechstart = previous.onspeechend = null;
      try { previous.abort(); } catch (_) {}
    }
    state.recognition = null;
    state.recognitionRunning = false;
    state.recognitionStarting = false;
    state.manualStop = false;
    state.needsGestureRestart = false;
    if (audioManager.audioContext) audioManager.audioContext.resume().catch(() => {});
    if (speechRecognition.init()) speechRecognition.start();
    debugLogger.log('Relance discrète du micro demandée par le staff', 'info');
  }
  elements.staffTapZone.addEventListener('click', () => {
    if (!state.started) return;
    staffTapCount++;
    clearTimeout(staffTapTimer);
    staffTapTimer = setTimeout(() => { staffTapCount = 0; }, 2000);
    if (staffTapCount >= 5) {
      staffTapCount = 0;
      restartListeningFromGesture();
    }
  });


  // ==========================================================
  // TAP DE SECOURS iPAD
  // ==========================================================

  /*
   Safari peut parfois arrêter
   SpeechRecognition.

   Dans certains cas il refuse
   de redémarrer le micro sans
   un nouveau geste utilisateur.

   Dans ce cas :
   → un tap n'importe où
   → relance le micro

   IMPORTANT :
   ce tap NE RÉVEILLE PAS Astra.

   state.awake reste inchangé.
  */

  document.addEventListener(

    "touchstart",

    () => {


      if (
        !state.started
      ) {

        return;

      }


      if (
        !state.needsGestureRestart
      ) {

        return;

      }


      debugLogger.log(
        "👆 Tap secours iOS",
        "info"
      );


      state.needsGestureRestart =
        false;


      // ======================================================
      // NOUVEL ESSAI DE DÉBLOCAGE AUDIO
      // ======================================================

      if (!state.isPlaying) audioManager.unlock();


      // ======================================================
      // RELANCE MICRO
      // ======================================================

      if (
        state.recognition
      ) {

        speechRecognition.start();

      }

      else {

        if (
          speechRecognition.init()
        ) {

          speechRecognition.start();

        }

      }

    },

    {
      passive: true
    }

  );


  // ==========================================================
  // RETOUR APRÈS VEILLE / CHANGEMENT D'APPLICATION
  // ==========================================================

  document.addEventListener(

    "visibilitychange",

    () => {


      // ======================================================
      // PAGE MASQUÉE
      // ======================================================

      if (
        document.visibilityState !==
        "visible"
      ) {

        debugLogger.log(
          "Page en arrière-plan",
          "info"
        );


        return;

      }


      // ======================================================
      // PAGE REDEVENUE VISIBLE
      // ======================================================

      debugLogger.log(
        "Page redevenue visible",
        "info"
      );


      if (
        !state.started
      ) {

        return;

      }


      /*
       On laisse Safari respirer
       un petit moment avant
       de tenter le redémarrage.
      */

      setTimeout(

        () => {

          if (
            !state.recognitionRunning &&
            !state.needsGestureRestart
          ) {

            speechRecognition.start();

          }

        },

        800

      );

    }

  );


  // ==========================================================
  // CHARGEMENT INITIAL
  // ==========================================================

  window.addEventListener(

    "load",

    () => {


      // ======================================================
      // BANDEAU
      // ======================================================

      utils.updateBandeau();


      // ======================================================
      // ÉTAT INITIAL
      // ======================================================

      /*
       Sécurité supplémentaire :

       au chargement de la page,
       Astra est TOUJOURS verrouillée et attend le mot de passe.
      */

      state.awake =
        false;


      state.mdpValid =
        false;

      document.body.classList.remove("passwordFound");


      // ======================================================
      // PRÉCHARGEMENT DES MP3
      // ======================================================

      /*
       On demande immédiatement
       au navigateur de récupérer
       les fichiers audio.

       Cela permet de réduire
       le délai entre :

       phrase reconnue
             ↓
       bip
             ↓
       réponse Astra
      */

      // Préchargement au choix de langue par le GM.


      // ======================================================
      // LOGS
      // ======================================================

      debugLogger.log(
        "================================",
        "info"
      );


      debugLogger.log(
        "ASTRA — VERSION iPad + VEILLE",
        "success"
      );


      debugLogger.log(
        "Page chargée",
        "success"
      );


      debugLogger.log(
        "💤 Astra est endormie",
        "info"
      );


      debugLogger.log(
        "En attente du choix de langue GM...",
        "info"
      );


      debugLogger.log(
        "================================",
        "info"
      );

    }

  );


  // ==========================================================
  // ERREURS JAVASCRIPT GLOBALES
  // ==========================================================

  window.addEventListener(

    "error",

    event => {

      debugLogger.log(
        `ERREUR JS : ${event.message} — ligne ${event.lineno}`,
        "error"
      );

    }

  );


  // ==========================================================
  // PROMESSES REJETÉES
  // ==========================================================

  window.addEventListener(

    "unhandledrejection",

    event => {


      const reason =
        event.reason;


      let message =
        "Erreur Promise inconnue";


      if (
        reason
      ) {

        if (
          reason.name ||
          reason.message
        ) {

          message =

            `${reason.name || "Error"} / ${reason.message || reason}`;

        }

        else {

          message =
            String(reason);

        }

      }


      debugLogger.log(
        `PROMISE REJETÉE : ${message}`,
        "error"
      );

    }

  );


  document.getElementById('launchDiagnostics').addEventListener('toggle', () => phraseHistory.render());
  document.getElementById('clearPhraseHistory').addEventListener('click', () => phraseHistory.clear());
  phraseHistory.restore();

  // ==========================================================
  // FIN ASTRA
  // ==========================================================

</script>

</body>

</html>
