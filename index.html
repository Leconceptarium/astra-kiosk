    Astra – Assistant de M. Morpheus
  </title>

  <style>

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      overflow: hidden;
      width: 100%;
      height: 100%;
      background: #000;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: 'Unica One', serif;

      /*
       L'interface est affichée en miroir.
      */
      transform: scaleX(-1);
    }

    /* ======================================================
       VIDÉOS ASTRA
       ====================================================== */

    video {
      position: absolute;
      top: 50%;
      left: 50%;

      width: 95%;
      height: auto;

      transform: translate(-50%, -50%);

      object-fit: contain;

      background: #000;

      opacity: 0;

      transition:
        opacity 0.6s ease;

      display: none;
    }

    #astraIdle.active,
    #astraIdle2.active {
      display: block;
      opacity: 1;
      z-index: 1;
    }

    #astraReaction {
      display: none;
      z-index: 2;
    }

    /* ======================================================
       BANDEAU
       ====================================================== */

    #bandeau {
      position: fixed;

      bottom: 8%;
      width: 100%;

      background: transparent;

      color:
        rgba(
          0,
          255,
          220,
          0.85
        );

      font-size:
        clamp(
          1.2rem,
          3vw,
          2.2rem
        );

      text-align: center;

      padding:
        0 5%;

      text-shadow:
        0 0 15px
          rgba(
            0,
            255,
            200,
            0.8
          ),

        0 0 30px
          rgba(
            0,
            255,
            200,
            0.4
          );

      letter-spacing: 2px;

      z-index: 3;

      animation:
        bandeauPulse
        4s
        ease-in-out
        infinite;

      pointer-events: none;
    }

    #bandeau span {
      display: block;
      white-space: normal;
    }

    @keyframes bandeauPulse {

      0%,
      100% {
        opacity: 0.35;
      }

      50% {
        opacity: 0.9;
      }

    }

    /* ======================================================
       PARCHEMIN VIDÉO
       ====================================================== */

    #parcheminImage {

      position: fixed;

      top: 50%;
      left: 50%;

      /* Plein écran + inversion horizontale pour le Pepper's Ghost */
      transform: translate(-50%, -50%) scaleX(-1);

      width: 100vw;
      height: 100vh;
      max-width: none;
      max-height: none;

      object-fit: contain;

      z-index: 4;

      display: none;

      opacity: 0;

      transition:
        opacity 0.5s ease;

      background: transparent;
    }

    #parcheminImage.visible {
      opacity: 1;
    }

    /* ======================================================
       PARTICULES MAGIQUES
       ====================================================== */

    .magic {

      position: absolute;

      width: 26px;
      height: 26px;

      border-radius: 50%;

      background:

        radial-gradient(

          circle,

          rgba(
            0,
            255,
            255,
            0.8
          )
          0%,

          rgba(
            0,
            255,
            150,
            0.25
          )
          40%,

          rgba(
            0,
            100,
            100,
            0.1
          )
          65%,

          transparent
          85%

        );

      filter:
        blur(3px)
        brightness(2.2);

      mix-blend-mode:
        screen;

      animation:
        fallMagic
        6s
        ease-in-out
        forwards;

      pointer-events:
        none;

      z-index: 5;
    }

    @keyframes fallMagic {

      0% {

        transform:
          translateY(-600px)
          scale(1.3)
          rotate(0deg);

        opacity: 0;

      }

      20% {

        opacity: 1;

      }

      60% {

        transform:
          translateY(0px)
          scale(0.8)
          rotate(180deg);

        opacity: 0.9;

      }

      100% {

        transform:
          translateY(400px)
          scale(0.6)
          rotate(360deg);

        opacity: 0;

      }

    }
        /* ======================================================
       TRANSITION MAGIQUE
       ====================================================== */

    #transitionFade {

      position: fixed;

      inset: 0;

      background:
        radial-gradient(
          circle at center,
          rgba(0, 255, 255, 0.9) 0%,
          rgba(0, 255, 150, 0.4) 30%,
          rgba(0, 100, 100, 0.2) 55%,
          transparent 75%
        );

      opacity: 0;

      pointer-events: none;

      transition:
        opacity
        1.2s
        ease;

      z-index: 9;
    }

       INTERFACE STAFF
       ====================================================== */

    #fullscreenBtn,
    #statusIndicator,
    #languageSelector,
    #debugToggle,
    #debugPanel {

        none !important;

    body.staffMode

      transform:

    /* ======================================================
       STATUT
       ====================================================== */

    #statusIndicator {

      position: fixed;

      top: 20px;
      right: 25px;

      z-index: 10;

      align-items: center;

      gap: 10px;

      padding:
        10px 15px;

      background:
        rgba(0, 0, 0, 0.5);

      border-radius: 20px;

      color: #fff;

      font-size: 14px;

      opacity: 0;

      transition:
        opacity
        0.3s
        ease;

      transform:
        scaleX(-1);

    }

    #statusIndicator.visible {
      opacity: 1;
    }

    .status-dot {

      width: 10px;
      height: 10px;

      border-radius: 50%;

      background: #ff4444;

      animation:

    }

    .status-dot.listening {

    }

      0%,
      100% {

      }

      50% {

      }

    }


    /* ======================================================
       ERREURS
       ====================================================== */

    /* ======================================================

      left: 20px;

      const logEntry =

      this.logs.push(

        this.logs.length > 100

      console.log(

    update() {

      if (

        return;

      elements.debugPanel.innerHTML =

        this.logs
          .map(
            log =>

          )
          .join("");

      elements.debugPanel.scrollTop =

        elements.debugPanel

    },


    clear() {

      this.logs = [];

  /*
   On demande à Safari de charger les fichiers audio
   le plus tôt possible.

   Ça permet de réduire le délai entre :
   → la phrase reconnue
   → la réponse d'Astra
  */

  const audioPreloader = {

    cache: [],


    preloadAll() {

      const files =
        new Set();


      // Bip robotique
      files.add(
        "biprobotic.mp3"
      );


      // ------------------------------------------------------
      // Toutes les réponses dans toutes les langues
      // ------------------------------------------------------

      Object.values(
        audioFiles
      )

      .forEach(
        languageFiles => {

          Object.values(
            languageFiles
          )

          .forEach(
            value => {

              if (
                Array.isArray(
                  value
                )
              ) {

                value.forEach(
                  file => {

                    files.add(
                      file
                    );

                  }
                );

              }

              else if (
                typeof value ===
                "string"
              ) {

                files.add(
                  value
                );

              }

            }
          );

        }
      );


      // ------------------------------------------------------
      // Création des lecteurs de préchargement
      // ------------------------------------------------------

      files.forEach(
        file => {

          const audio =
            new Audio();

          audio.preload =
            "auto";

          audio.src =
            file;


          try {

            audio.load();

          }

          catch (_) {}


          this.cache.push(
            audio
          );

        }
      );


      debugLogger.log(
        `${files.size} fichiers audio demandés en préchargement`,
        "success"
      );

    }

  };


  // ==========================================================
  // GESTION AUDIO
  // ==========================================================

  /*
   IMPORTANT POUR L'IPAD :

   On garde toujours les mêmes lecteurs Audio.

   currentAudio
      = voix d'Astra

   thinkingAudio
      = biprobotic.mp3


   Fonctionnement :

   phrase reconnue
        ↓
   bip robotique
        ↓
   attente 100 ms seulement
        ↓
   bip coupé
        ↓
   Astra répond
  */


  const audioManager = {

    // --------------------------------------------------------
    // Lecteur principal Astra
    // --------------------------------------------------------
// --------------------------------------------------------
// AMPLIFICATION DE LA VOIX D'ASTRA
// --------------------------------------------------------

audioContext: null,
gainNode: null,
audioSource: null,

voiceGain: 4,


initAmplifier() {

  // Déjà initialisé → ne surtout pas recréer la source
  if (this.audioContext) {
    return;
  }

  try {

    const AudioContext =
      window.AudioContext ||
      window.webkitAudioContext;

    if (!AudioContext) {
      debugLogger.log(
        "Web Audio API indisponible",
        "warn"
      );
      return;
    }

    this.audioContext =
      new AudioContext();

    this.audioSource =
      this.audioContext.createMediaElementSource(
        this.currentAudio
      );

    this.gainNode =
      this.audioContext.createGain();

    this.gainNode.gain.value =
      this.voiceGain;

    this.audioSource.connect(
      this.gainNode
    );

    this.gainNode.connect(
      this.audioContext.destination
    );

    debugLogger.log(
      `🔊 Amplificateur Astra activé : x${this.voiceGain}`,
      "success"
    );

  }

  catch (err) {

    debugLogger.log(
      `Erreur amplificateur : ${err.message}`,
      "error"
    );

  }

},
    currentAudio:
      new Audio(),


    // --------------------------------------------------------
    // Lecteur du bip
    // --------------------------------------------------------

    thinkingAudio:
      new Audio(
        "biprobotic.mp3"
      ),


    unlocked:
      false,


    safetyTimeout:
      null,


    // ========================================================
    // DÉBLOCAGE AUDIO iOS
    // ========================================================

    unlock() {

      try {

        const audio =
          this.currentAudio;


        /*
         Petit fichier WAV silencieux.

         Il est joué lors du premier tap staff
         pour autoriser ensuite Safari à lire
         les fichiers audio.
        */

        audio.src =
          "data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YQAAAAA=";


        audio.volume =
          0.01;


        const promise =
          audio.play();


        if (
          promise &&
          promise.then
        ) {

          promise

            .then(
              () => {

                audio.pause();


                try {

                  audio.currentTime =
                    0;

                }

                catch (_) {}


                audio.volume =
                  1;


                this.unlocked =
                  true;


                debugLogger.log(
                  "✓ Audio principal débloqué sur iOS",
                  "success"
                );


                // Préparation du bip

                this.thinkingAudio.preload =
                  "auto";


                try {

                  this.thinkingAudio.load();

                }

                catch (_) {}

              }
            )


            .catch(
              err => {

                this.unlocked =
                  false;


                debugLogger.log(
                  `Échec unlock audio : ${err.name} / ${err.message}`,
                  "error"
                );

              }
            );

        }

        else {

          this.unlocked =
            true;

        }

      }

      catch (err) {

        this.unlocked =
          false;


        debugLogger.log(
          `Erreur unlock audio : ${err.message}`,
          "error"
        );

      }

    },


    // ========================================================
    // LECTURE D'UNE RÉPONSE ASTRA
    // ========================================================

    play(
      file,
      videoName = VIDEO.talk
    ) {

      debugLogger.log(
        `Réponse demandée : ${file}`,
        "audio"
      );


      debugLogger.log(
        `Audio débloqué : ${this.unlocked}`,
        "info"
      );


      // ------------------------------------------------------
      // Astra parle déjà
      // ------------------------------------------------------

      if (
        state.isPlaying
      ) {

        debugLogger.log(
          "Astra parle déjà — nouvelle réponse ignorée",
          "warn"
        );

        return;

      }


      state.isPlaying =
        true;


      const audio =
        this.currentAudio;


      const bip =
        this.thinkingAudio;


      // ======================================================
      // NETTOYAGE
      // ======================================================

      try {

        audio.pause();

      }

      catch (_) {}


      try {

        bip.pause();

        bip.currentTime =
          0;

      }

      catch (_) {}


      audio.onended =
        null;

      audio.onerror =
        null;

      audio.onloadeddata =
        null;

      audio.oncanplay =
        null;

      audio.oncanplaythrough =
        null;


      bip.onended =
        null;

      bip.onerror =
        null;


      // ======================================================
      // PRÉPARATION IMMÉDIATE DE LA RÉPONSE
      // ======================================================

      audio.src =
        file;


      audio.volume =
        1;


      audio.preload =
        "auto";


      /*
       On lance immédiatement l'animation
       correspondant à la réponse.
      */

      videoManager.playReaction(
        videoName
      );


      // ======================================================
      // FILET DE SÉCURITÉ
      // ======================================================

      if (
        this.safetyTimeout
      ) {

        clearTimeout(
          this.safetyTimeout
        );

      }


      this.safetyTimeout =

        setTimeout(
          () => {

            if (
              !state.isPlaying
            ) {

              return;

            }


            debugLogger.log(
              "Timeout audio — déblocage forcé",
              "warn"
            );


            try {

              audio.pause();

            }

            catch (_) {}


            try {

              bip.pause();

            }

            catch (_) {}


            videoManager.endReaction();


            state.isPlaying =
              false;

          },

          30000
        );


      // ======================================================
      // ÉTAT DE CHARGEMENT
      // ======================================================

      let responseReady =
        audio.readyState >= 3;


      let bipFinished =
        false;


      let responseStarted =
        false;


      // ======================================================
      // DÉMARRAGE DE LA RÉPONSE
      // ======================================================

      const maybeStartResponse =
        () => {

          if (
            responseStarted ||
            !responseReady ||
            !bipFinished
          ) {

            return;

          }


          responseStarted =
            true;


          debugLogger.log(
            `▶ Démarrage réponse Astra : ${file}`,
            "success"
          );


          const playPromise =
            audio.play();


          if (
            playPromise &&
            playPromise.then
          ) {

            playPromise

              .then(
                () => {

                  debugLogger.log(
                    `✓ ASTRA PARLE : ${file}`,
                    "success"
                  );

                }
              )


              .catch(
                err => {

                  debugLogger.log(
                    `✗ Lecture réponse refusée : ${err.name} / ${err.message}`,
                    "error"
                  );


                  if (
                    this.safetyTimeout
                  ) {

                    clearTimeout(
                      this.safetyTimeout
                    );

                  }


                  videoManager.endReaction();


                  state.isPlaying =
                    false;

                }
              );

          }

        };


      // ======================================================
      // RÉPONSE AUDIO PRÊTE
      // ======================================================

      const markResponseReady =
        () => {

          responseReady =
            true;


          debugLogger.log(
            `Réponse audio prête : ${file}`,
            "success"
          );


          maybeStartResponse();

        };


      audio.onloadeddata =
        markResponseReady;


      audio.oncanplay =
        markResponseReady;


      audio.oncanplaythrough =
        markResponseReady;


      // ======================================================
      // ERREUR AUDIO
      // ======================================================

      audio.onerror =
        () => {

          const errorCode =

            audio.error

              ? audio.error.code

              : "inconnu";


          debugLogger.log(
            `✗ ERREUR AUDIO : ${file} / code ${errorCode}`,
            "error"
          );


          if (
            this.safetyTimeout
          ) {

            clearTimeout(
              this.safetyTimeout
            );

          }


          try {

            bip.pause();

          }

          catch (_) {}


          videoManager.endReaction();


          state.isPlaying =
            false;


          utils.showError(
            `Audio introuvable : ${file}`,
            3000
          );

        };


      // ======================================================
      // FIN DE LA RÉPONSE
      // ======================================================

      audio.onended =
        () => {

          debugLogger.log(
            `Audio terminé : ${file}`,
            "info"
          );


          if (
            this.safetyTimeout
          ) {

            clearTimeout(
              this.safetyTimeout
            );

          }


          videoManager.endReaction();


          state.isPlaying =
            false;

        };


      // ======================================================
      // BIP ROBOTIQUE RAPIDE
      // ======================================================

      /*
       IMPORTANT :

       On ne laisse PLUS le bip se jouer entièrement.

       Il démarre...

       puis 20 ms plus tard :

       → on considère l'attente terminée
       → on coupe le bip
       → Astra peut parler immédiatement
      */


      bip.onerror =
        () => {

          bipFinished =
            true;


          debugLogger.log(
            "biprobotic.mp3 indisponible — réponse sans bip",
            "warn"
          );


          maybeStartResponse();

        };


      // ======================================================
      // LANCEMENT DU BIP
      // ======================================================

      try {

        bip.currentTime =
          0;


        const bipPromise =
          bip.play();


        if (
          bipPromise &&
          bipPromise.then
        ) {

          bipPromise

            .then(
              () => {

                debugLogger.log(
                  "🤖 Bip robotique",
                  "success"
                );


                // --------------------------------------------
                // ATTENTE ULTRA COURTE : 20 ms
                // --------------------------------------------

                setTimeout(
                  () => {

                    bipFinished =
                      true;


                    /*
                     On coupe le bip afin qu'il
                     ne continue pas pendant
                     la voix d'Astra.
                    */

                    try {

                      bip.pause();

                      bip.currentTime =
                        0;

                    }

                    catch (_) {}


                    debugLogger.log(
                      "⚡ Fin attente bip → réponse Astra",
                      "info"
                    );


                    maybeStartResponse();

                  },

                  20
                );

              }
            )


            .catch(
              err => {

                bipFinished =
                  true;


                debugLogger.log(
                  `Bip refusé : ${err.name} / ${err.message}`,
                  "warn"
                );


                maybeStartResponse();

              }
            );

        }

        else {

          /*
           Très vieux navigateur :
           on ne bloque pas la réponse.
          */

          setTimeout(
            () => {

              bipFinished =
                true;


              try {

                bip.pause();

                bip.currentTime =
                  0;

              }

              catch (_) {}


              maybeStartResponse();

            },

            20
          );

        }

  const speechRecognition = {

    // ========================================================
    // CODE LANGUE
    // ========================================================

    getLangCode() {

      const codes = {

        fr: "fr-FR",

        en: "en-US",

        de: "de-DE"

      };

      return codes[
        state.currentLang
      ] || "fr-FR";

    },


    // ========================================================
    // INITIALISATION
    // ========================================================

    init() {

      const SpeechRecognition =

        window.SpeechRecognition ||

        window.webkitSpeechRecognition;


      // ------------------------------------------------------
      // API NON DISPONIBLE
      // ------------------------------------------------------

      if (
        !SpeechRecognition
      ) {

        debugLogger.log(
          "SpeechRecognition non disponible",
          "error"
        );


        utils.showError(
          translations[
            state.currentLang
          ].errorSpeechNotSupported,
          5000
        );


        return false;

      }


      debugLogger.log(
        "✓ API SpeechRecognition disponible",
        "success"
      );


      // ------------------------------------------------------
      // NETTOYAGE ANCIENNE INSTANCE
      // ------------------------------------------------------

      if (
        state.recognition
      ) {

        try {

          state.recognition.abort();

        }

        catch (_) {}

      }


      // ------------------------------------------------------
      // CRÉATION
      // ------------------------------------------------------

      state.recognition =
        new SpeechRecognition();


      /*
       Safari peut arrêter la reconnaissance
       même avec continuous = true.

       Le onend plus bas la relancera
       automatiquement.
      */

      state.recognition.continuous =
        true;


      state.recognition.interimResults =
        false;


      state.recognition.maxAlternatives =
        1;


      state.recognition.lang =
        this.getLangCode();


      debugLogger.log(
        `Langue reconnaissance : ${state.recognition.lang}`,
        "info"
      );


      // ======================================================
      // DÉMARRAGE EFFECTIF
      // ======================================================

      state.recognition.onstart =
        () => {

          state.recognitionRunning =
            true;


          state.needsGestureRestart =
            false;


          debugLogger.log(
            "🎙️ Astra écoute",
            "success"
          );


          utils.updateStatus(
            "listening",
            true
          );

        };


      // ======================================================
      // VOIX DÉTECTÉE
      // ======================================================

      state.recognition.onspeechstart =
        () => {

          debugLogger.log(
            "🎙️ Voix détectée",
            "speech"
          );

        };


      state.recognition.onspeechend =
        () => {

          debugLogger.log(
            "Fin de phrase détectée",
            "speech"
          );

        };


      // ======================================================
      // RÉSULTAT VOCAL
      // ======================================================

      state.recognition.onresult =
        event => {

          try {

            const result =

              event.results[
                event.results.length - 1
              ];


            const alternative =
              result[0];


            const text =

              alternative.transcript
                .trim();


            const confidence =

              typeof alternative.confidence ===
              "number"

                ? alternative.confidence

                : 0;


            debugLogger.log(
              `🎙️ Entendu : "${text}"`,
              "speech"
            );


            debugLogger.log(
              `Confiance : ${Math.round(confidence * 100)}%`,
              "info"
            );


            // =================================================
            // ASTRA PARLE DÉJÀ
            // =================================================
            //
            // On ignore tout ce que le micro
            // reconnaît pendant sa propre réponse.
            //
            // =================================================

            if (
              state.isPlaying
            ) {

              debugLogger.log(
                "Résultat ignoré : Astra parle déjà",
                "warn"
              );

              return;

            }


            // =================================================
            // ANALYSE DE LA PHRASE
            // =================================================

            const response =

              phraseDetector.detect(
                text
              );


            /*
             IMPORTANT :

             Quand Astra est encore verrouillée,
             phraseDetector.detect() retourne null.

             Donc :
             → aucun bip
             → aucun audio
             → aucune animation
             → silence complet pendant le brief
            */

            if (
              response &&
              response.file
            ) {

              debugLogger.log(
                `✓ Réponse choisie : ${response.file}`,
                "success"
              );


              audioManager.play(
                response.file,
                response.video
              );

            }

            else {

              /*
               Ce cas est NORMAL lorsque
               state.awake === false (mot de passe non validé).

               On ne joue surtout pas
               phrase_non_reconnue.mp3 ici.
              */

              if (
                !state.awake
              ) {

                debugLogger.log(
                  "Astra attend le mot de passe → aucune réponse",
                  "info"
                );

              }

              else {

                debugLogger.log(
                  "Aucune réponse retournée",
                  "warn"
                );

              }

            }

          }

          catch (err) {

            debugLogger.log(
              `Erreur résultat vocal : ${err.message}`,
              "error"
            );

          }

        };


      // ======================================================
      // ERREURS SPEECH RECOGNITION
      // ======================================================

      state.recognition.onerror =
        event => {

          const error =

            event.error ||
            "inconnue";


          debugLogger.log(
            `Erreur reconnaissance : ${error}`,
            "error"
          );


          // --------------------------------------------------
          // AUCUNE PAROLE
          // --------------------------------------------------

          if (
            error === "no-speech"
          ) {

            debugLogger.log(
              "Pas de parole détectée",
              "info"
            );

            return;

          }


          // --------------------------------------------------
          // ARRÊT VOLONTAIRE
          // --------------------------------------------------

          if (
            error === "aborted"
          ) {

            debugLogger.log(
              "Reconnaissance interrompue",
              "info"
            );

            return;

          }


          // --------------------------------------------------
          // SAFARI DEMANDE UN NOUVEAU GESTE
          // --------------------------------------------------

          if (
            error === "not-allowed"
          ) {

            state.needsGestureRestart =
              true;


            debugLogger.log(
              "⚠️ Safari demande un nouveau tap pour relancer le micro",
              "warn"
            );


            utils.updateStatus(
              "micDisabled",
              false
            );

            return;

          }


          // --------------------------------------------------
          // MICRO INDISPONIBLE
          // --------------------------------------------------

          if (
            error === "audio-capture"
          ) {

            debugLogger.log(
              "Microphone indisponible",
              "error"
            );


            utils.updateStatus(
              "micError",
              false
            );

            return;

          }


          // --------------------------------------------------
          // ERREUR RÉSEAU
          // --------------------------------------------------

          if (
            error === "network"
          ) {

            debugLogger.log(
              "Erreur réseau SpeechRecognition",
              "error"
            );


            utils.updateStatus(
              "micError",
              false
            );

            return;

          }


          // --------------------------------------------------
          // AUTRE ERREUR
          // --------------------------------------------------

          utils.updateStatus(
            "micError",
            false
          );

        };


      // ======================================================
      // FIN DE RECONNAISSANCE
      // ======================================================

      state.recognition.onend =
        () => {

          state.recognitionRunning =
            false;


          debugLogger.log(
            "Reconnaissance arrêtée",
            "info"
          );


          // --------------------------------------------------
          // CHANGEMENT DE LANGUE
          // --------------------------------------------------

          /*
           Si l'arrêt vient du changement
           de langue, languageManager
           s'occupe lui-même du redémarrage.
          */

          if (
            state.manualStop
          ) {

            state.manualStop =
              false;

            return;

          }


          // --------------------------------------------------
          // SAFARI ATTEND UN TAP
          // --------------------------------------------------

          if (
            state.needsGestureRestart
          ) {

            debugLogger.log(
              "En attente d'un tap écran",
              "warn"
            );

            return;

          }


          // --------------------------------------------------
          // ASTRA PAS ENCORE DÉMARRÉE
          // --------------------------------------------------

          if (
            !state.started
          ) {

            return;

          }


          // --------------------------------------------------
          // REDÉMARRAGE AUTOMATIQUE
          // --------------------------------------------------

          /*
           Safari coupe parfois la reconnaissance
           sans raison apparente.

           On la relance après 350 ms.
          */

          setTimeout(
            () => {

              if (
                !state.started ||
                state.needsGestureRestart
              ) {

                return;

              }


              this.start();

            },

            350
          );

        };


      return true;

    },


    // ========================================================
    // CHANGEMENT DE LANGUE MICRO
    // ========================================================

    updateLanguage() {

      if (
        !state.recognition
      ) {

        return;

      }


      state.recognition.lang =
        this.getLangCode();


      debugLogger.log(
        `Nouvelle langue micro : ${state.recognition.lang}`,
        "info"
      );

    },


    // ========================================================
    // DÉMARRAGE RECONNAISSANCE
    // ========================================================

    start() {

      if (
        !state.recognition
      ) {

        return;

      }


      /*
       Évite d'envoyer plusieurs start()
       simultanément à Safari.
      */

      if (
        state.recognitionRunning
      ) {

        return;

      }


      try {

        state.recognition.start();


        debugLogger.log(
          "recognition.start() envoyé",
          "info"
        );

      }

      catch (err) {


        // ----------------------------------------------------
        // SAFARI PENSE QUE LE MICRO TOURNE ENCORE
        // ----------------------------------------------------

        if (
          err.name ===
          "InvalidStateError"
        ) {

          debugLogger.log(
            "Reconnaissance déjà active selon Safari",
            "info"
          );

          return;

        }


        // ----------------------------------------------------
        // AUTRE ERREUR
        // ----------------------------------------------------

        debugLogger.log(
          `Erreur start : ${err.name} / ${err.message}`,
          "error"
        );


        state.needsGestureRestart =
          true;

      }

    }

  };

  // ==========================================================

  let staffTapCount = 0;

  let staffTapTimer = null;


  elements.staffTapZone
    .addEventListener(

      "click",

      () => {


        // ====================================================
        // PREMIER TAP = DÉMARRAGE ASTRA
        // ====================================================

        if (
          !state.started
        ) {

          state.started = true;


          /*
           IMPORTANT :

           Même après ce premier tap,
           Astra reste "endormie".

           Elle écoute le micro,
           mais elle ne répond à RIEN
           tant qu'elle n'entend pas le mot de passe :

           FR : Bonne nuit
           EN : Good night
           DE : Gute Nacht
          */

          state.awake = false;


          debugLogger.log(
            "👆 Premier tap staff",
            "success"
          );


          debugLogger.log(
            "🔒 Astra attend maintenant le mot de passe",
            "info"
          );


          // ==================================================
          // DÉBLOCAGE AUDIO iOS
          // ==================================================

          /*
           IMPORTANT IPAD :

           audioManager.unlock()
           doit rester DIRECTEMENT
           dans l'événement click.

           Ne pas le déplacer dans
           un setTimeout.
          */

          audioManager.unlock();


          // ==================================================
          // DÉBLOCAGE DU BIP
          // ==================================================

          try {

            const bip =
              audioManager.thinkingAudio;


            bip.volume =
              0.01;


            const bipUnlock =
              bip.play();


            if (
              bipUnlock &&
              bipUnlock.then
            ) {

              bipUnlock

                .then(
                  () => {

                    bip.pause();


                    try {

                      bip.currentTime =
                        0;

                    }

                    catch (_) {}


                    bip.volume =
                      1;


                    debugLogger.log(
                      "✓ Lecteur bip débloqué",
                      "success"
                    );

                  }
                )

                .catch(
                  err => {

                    bip.volume =
                      1;


                    debugLogger.log(
                      `Unlock bip refusé : ${err.message}`,
                      "warn"
                    );

                  }
                );

            }

          }

          catch (err) {

            debugLogger.log(
              `Erreur unlock bip : ${err.message}`,
              "warn"
            );

          }


          // ==================================================
          // VIDÉO INITIALE
          // ==================================================

          try {

            elements.astraIdle.muted =
              true;


            elements.astraIdle.style.display =
              "block";


            elements.astraIdle
              .classList
              .add(
                "active"
              );


            elements.astraIdle
              .play()
              .catch(
                () => {}
              );

          }

          catch (_) {}


          // ==================================================
          // INITIALISATION ASTRA
          // ==================================================

          /*
           Pas de await ici.

           On veut rester le plus proche
           possible du geste utilisateur
           pour Safari / iPad.
          */

          app.init();

          // ==================================================
          // INDICE AUTOMATIQUE APRÈS 5 MINUTES
          // ==================================================
          // Si personne n'a encore trouvé le mot de passe,
          // Astra apparaît énervée avec le chaudron dans les bras.

          if (state.passwordHintTimer) {
            clearTimeout(state.passwordHintTimer);
          }

          state.passwordHintTimer = setTimeout(() => {

            if (!state.mdpValid && !state.awake && !state.isPlaying) {
              debugLogger.log(
                "⏱️ 5 min sans mot de passe — indice chaudron automatique",
                "info"
              );

              videoManager.playStandaloneReaction(
                VIDEO.cauldronHint
              );
            }

            state.passwordHintTimer = null;

          }, 5 * 60 * 1000);


          return;

        }


        // ====================================================
        // 5 TAPS = MODE STAFF
        // ====================================================

        staffTapCount++;


        clearTimeout(
          staffTapTimer
        );


        staffTapTimer =
          setTimeout(

            () => {

              staffTapCount =
                0;

            },

            2000

          );


        if (
          staffTapCount >= 5
        ) {

          document.body
            .classList
            .toggle(
              "staffMode"
            );


          staffTapCount =
            0;


          debugLogger.log(

            document.body
              .classList
              .contains(
                "staffMode"
              )

              ? "Mode staff activé"

              : "Mode staff désactivé",

            "info"

          );

        }

      }

    );


  // ==========================================================

  // ==========================================================

  /*
   Safari peut parfois arrêter
   SpeechRecognition.

   Dans certains cas il refuse
   de redémarrer le micro sans
   un nouveau geste utilisateur.

   Dans ce cas :
   → un tap n'importe où

        state.recognition

        speechRecognition.start();

        if (

        }

        "Erreur Promise inconnue";


      if (
        reason
      ) {

        if (
          reason.name ||
          reason.message
        ) {

          message =

            `${reason.name || "Error"} / ${reason.message || reason}`;

        }

        else {

          message =
            String(reason);

        }

      }


      debugLogger.log(
        `PROMISE REJETÉE : ${message}`,
        "error"
      );

    }

  );


  // ==========================================================
  // FIN ASTRA
  // ==========================================================

</script>
