<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Astra – Assistant de M. Morpheus</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      overflow: hidden;
      height: 100vh;
      background: #000;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: 'Unica One', serif;

      /* ===== MIROIR PEPPER'S GHOST ===== */
      transform: scaleX(-1);
    }

    video {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 95%;
      height: auto;
      transform: translate(-50%, -50%);
      object-fit: contain;
      background: #000;
      opacity: 0;
      transition: opacity 0.6s ease;
      display: none;
    }

    #astraIdle.active,
    #astraIdle2.active {
      display: block;
      opacity: 1;
      z-index: 1;
    }

    #astraReaction {
      z-index: 2;
      display: none;
    }

    /* ===== BANDEAU ===== */

    #bandeau {
      position: fixed;
      bottom: 8%;
      width: 100%;
      background: transparent;
      color: rgba(0, 255, 220, 0.85);
      font-size: clamp(1.2rem, 3vw, 2.2rem);
      text-align: center;
      padding: 0 5%;
      text-shadow:
        0 0 15px rgba(0, 255, 200, 0.8),
        0 0 30px rgba(0, 255, 200, 0.4);
      letter-spacing: 2px;
      z-index: 3;
      animation: bandeauPulse 4s ease-in-out infinite;
      pointer-events: none;
    }

    #bandeau span {
      display: block;
      white-space: normal;
    }

    @keyframes bandeauPulse {
      0%, 100% {
        opacity: 0.35;
      }

      50% {
        opacity: 0.9;
      }
    }

    /* ===== PARCHEMIN ===== */

    #parcheminImage {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      max-width: 80%;
      max-height: 80%;
      z-index: 4;
      display: none;
      opacity: 0;
      transition: opacity 0.5s ease;
    }

    #parcheminImage.visible {
      opacity: 1;
    }

    /* ===== PARTICULES MAGIQUES ===== */

    .magic {
      position: absolute;
      width: 26px;
      height: 26px;
      border-radius: 50%;

      background: radial-gradient(
        circle,
        rgba(0, 255, 255, 0.8) 0%,
        rgba(0, 255, 150, 0.25) 40%,
        rgba(0, 100, 100, 0.1) 65%,
        transparent 85%
      );

      filter: blur(3px) brightness(2.2);
      mix-blend-mode: screen;

      animation: fallMagic 6s ease-in-out forwards;

      pointer-events: none;
      z-index: 5;
    }

    @keyframes fallMagic {
      0% {
        transform: translateY(-600px) scale(1.3) rotate(0deg);
        opacity: 0;
      }

      20% {
        opacity: 1;
      }

      60% {
        transform: translateY(0px) scale(0.8) rotate(180deg);
        opacity: 0.9;
      }

      100% {
        transform: translateY(400px) scale(0.6) rotate(360deg);
        opacity: 0;
      }
    }

    /* ===== TRANSITION ===== */

    #transitionFade {
      position: fixed;
      inset: 0;

      background: radial-gradient(
        circle at center,
        rgba(0, 255, 255, 0.9) 0%,
        rgba(0, 255, 150, 0.4) 30%,
        rgba(0, 100, 100, 0.2) 55%,
        transparent 75%
      );

      opacity: 0;
      pointer-events: none;
      transition: opacity 1.2s ease;
      z-index: 9;
    }

    /* =====================================================
       MODE STAFF
       ===================================================== */

    #fullscreenBtn,
    #statusIndicator,
    #languageSelector,
    #debugToggle,
    #debugPanel {
      display: none !important;
    }

    body.staffMode #fullscreenBtn,
    body.staffMode #statusIndicator,
    body.staffMode #languageSelector,
    body.staffMode #debugToggle {
      display: flex !important;
    }

    body.staffMode #debugPanel.visible {
      display: block !important;
    }

    /* ===== PLEIN ÉCRAN ===== */

    #fullscreenBtn {
      position: fixed;
      bottom: 20px;
      right: 25px;

      z-index: 10;

      width: 50px;
      height: 50px;

      border: 2px solid rgba(255,255,255,0.3);
      border-radius: 50%;

      color: #fff;
      font-size: 22px;

      text-align: center;
      line-height: 46px;

      cursor: pointer;

      background: rgba(255,255,255,0.08);

      transition: all .3s ease;
      user-select: none;

      transform: scaleX(-1);
    }

    #fullscreenBtn:hover {
      background: rgba(255,255,255,0.2);
      border-color: rgba(255,255,255,0.6);
      transform: scaleX(-1) scale(1.1);
    }

    /* ===== STATUT ===== */

    #statusIndicator {
      position: fixed;
      top: 20px;
      right: 25px;

      z-index: 10;

      align-items: center;
      gap: 10px;

      padding: 10px 15px;

      background: rgba(0,0,0,0.5);

      border-radius: 20px;

      color: #fff;
      font-size: 14px;

      opacity: 0;

      transition: opacity 0.3s ease;

      transform: scaleX(-1);
    }

    #statusIndicator.visible {
      opacity: 1;
    }

    .status-dot {
      width: 10px;
      height: 10px;

      border-radius: 50%;

      background: #ff4444;

      animation: pulse 2s infinite;
    }

    .status-dot.listening {
      background: #44ff44;
    }

    @keyframes pulse {
      0%, 100% {
        opacity: 1;
      }

      50% {
        opacity: 0.5;
      }
    }

    /* ===== MESSAGE ERREUR ===== */

    #errorMessage {
      position: fixed;

      top: 50%;
      left: 50%;

      transform: translate(-50%, -50%) scaleX(-1);

      background: rgba(255, 50, 50, 0.9);

      color: white;

      padding: 20px 40px;

      border-radius: 10px;

      z-index: 11;

      display: none;

      text-align: center;

      max-width: 80%;
    }

    /* ===== DEBUG ===== */

    #debugPanel {
      position: fixed;

      bottom: 80px;
      left: 20px;

      background: rgba(0, 0, 0, 0.9);

      color: #0f0;

      padding: 15px;

      border-radius: 10px;

      font-family: monospace;
      font-size: 12px;

      max-width: 500px;
      max-height: 350px;

      overflow-y: auto;

      z-index: 12;

      transform: scaleX(-1);
    }

    #debugToggle {
      position: fixed;

      bottom: 80px;
      left: 20px;

      z-index: 13;

      padding: 8px 16px;

      background: rgba(0, 255, 0, 0.2);

      border: 2px solid rgba(0, 255, 0, 0.5);

      border-radius: 20px;

      color: #0f0;

      cursor: pointer;

      font-size: 12px;

      transform: scaleX(-1);
    }

    /* ===== LANGUES ===== */

    #languageSelector {
      position: fixed;

      top: 20px;
      left: 25px;

      z-index: 10;

      gap: 10px;

      transform: scaleX(-1);
    }

    .lang-btn {
      padding: 8px 16px;

      background: rgba(255,255,255,0.1);

      border: 2px solid rgba(255,255,255,0.3);

      border-radius: 20px;

      color: #fff;

      cursor: pointer;

      transition: all 0.3s ease;

      font-size: 14px;
    }

    .lang-btn:hover {
      background: rgba(255,255,255,0.2);
      border-color: rgba(255,255,255,0.5);
    }

    .lang-btn.active {
      background: rgba(0, 255, 255, 0.3);
      border-color: rgba(0, 255, 255, 0.7);
    }

    /* ===== ZONE STAFF INVISIBLE ===== */

    #staffTapZone {
      position: fixed;

      top: 0;
      left: 0;

      width: 80px;
      height: 80px;

      z-index: 20;

      cursor: default;
    }
  </style>

  // ==========================================================

  const utils = {

    showError(message, duration = 3000) {

      elements.errorMessage.textContent =
        message;

      elements.errorMessage.style.display =
        "block";

      setTimeout(() => {

        elements.errorMessage.style.display =
          "none";

      }, duration);
    },


    updateStatus(textKey, isListening = false) {

      const text =
        translations[state.currentLang][textKey]
        || textKey;

      elements.statusText.textContent =
        text;

      if (isListening) {

        elements.statusDot
          .classList
          .add("listening");

      } else {

        elements.statusDot
          .classList
          .remove("listening");
      }

      elements.statusIndicator
        .classList
        .add("visible");
    },


    hideStatus(delay = 2000) {

      setTimeout(() => {

        elements.statusIndicator
          .classList
          .remove("visible");

      }, delay);
    },


    getRandomFromArray(arr) {

      return arr[
        Math.floor(
          Math.random() * arr.length
        )
      ];

        "info"
      );

      state.currentLang =
        lang;

      const langButtons =
        elements.languageSelector

        if (

          btn.classList.add(
            "active"

          btn.classList.remove(
            "active"

      if (state.recognition) {

          true;

        try {

          state.recognition.stop();

          debugLogger.log(
            `Erreur arrêt reconnaissance : ${err.message}`,

            3000

            `Reconnaissance redémarrée en ${lang}`,
            "success"
          );

        }, 700);
      }
    }

  // ==========================================================
  // AUDIO MANAGER
  // ==========================================================
  //
  // IMPORTANT :
  //
  // Safari / iPadOS n'aime pas que l'on crée
  // un nouvel objet Audio après la commande
  // vocale.
  //
  // On crée donc UN SEUL lecteur.
  //
  // C'est CE lecteur qui est débloqué
  // lors du premier tap staff.
  //
  // Puis tous les MP3 utilisent
  // exactement le même lecteur.
  //
  // ==========================================================

  const audioManager = {

    currentAudio:
      new Audio(),

    unlocked:
      false,

    safetyTimeout:
      null,


    // ========================================================
    // DÉBLOCAGE AUDIO iOS
    // ========================================================

    unlock() {

      debugLogger.log(
        "Tentative de déblocage audio iOS...",
        "audio"
      );


      try {

        const audio =
          this.currentAudio;


        /*
         Petit WAV silencieux intégré
         directement dans la page.

         Il est lu pendant le TAP utilisateur.
        */

        audio.src =
          "data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YQAAAAA=";


        audio.volume =
          0.01;


        const promise =
          audio.play();


        if (
          promise &&
          promise.then
        ) {

          promise
            .then(() => {

              audio.pause();

              try {
                audio.currentTime = 0;
              } catch (_) {}


              audio.volume =
                1;


              this.unlocked =
                true;


              debugLogger.log(
                "✓ Audio iOS débloqué sur le lecteur principal",
                "success"
              );

            })
            .catch(err => {

              this.unlocked =
                false;


              debugLogger.log(
                `✗ Échec unlock audio : ${err.name} / ${err.message}`,
                "error"
              );

            });

        } else {

          this.unlocked =
            true;


          debugLogger.log(
            "✓ Audio débloqué",
            "success"
          );
        }

      } catch (err) {

        this.unlocked =
          false;


        debugLogger.log(
          `Erreur unlock audio : ${err.message}`,
          "error"
        );
      }
    },


    // ========================================================
    // LECTURE D'UNE RÉPONSE ASTRA
    // ========================================================

    play(
      file,
      videoName = VIDEO.talk
    ) {

      debugLogger.log(
        `Tentative lecture : ${file}`,
        "audio"
      );


      debugLogger.log(
        `Audio unlocked : ${this.unlocked}`,
        "info"
      );


      /*
       On ne lance pas deux réponses
       simultanément.
      */

      if (
        state.isPlaying
      ) {

        debugLogger.log(
          "Astra parle déjà : nouvelle réponse ignorée",
          "warn"
        );

        return;
      }


      state.isPlaying =
        true;


      const audio =
        this.currentAudio;


      // Nettoyage timeout précédent
      if (
        this.safetyTimeout
      ) {

        clearTimeout(
          this.safetyTimeout
        );
      }


      /*
       Filet de sécurité.

       Si Safari plante pendant une lecture,
       Astra ne restera pas bloquée pour toujours.
      */

      this.safetyTimeout =
        setTimeout(() => {

          if (
            state.isPlaying
          ) {

            debugLogger.log(
              "Timeout audio : déblocage forcé",
              "warn"
            );


            try {
              audio.pause();
            } catch (_) {}


            videoManager
              .endReaction();


            state.isPlaying =
              false;
          }

        }, 30000);


      // Stop ancienne lecture
      try {

        audio.pause();

      } catch (_) {}


      /*
       IMPORTANT :

       on garde le MÊME objet audio.
       On change uniquement sa source.
      */

      audio.onended =
        null;

      audio.onerror =
        null;

      audio.onloadeddata =
        null;

      audio.oncanplay =
        null;

      audio.oncanplaythrough =
        null;


      audio.src =
        file;


      audio.volume =
        1;


      audio.preload =
        "auto";


      // Vidéo réaction
      videoManager
        .playReaction(
          videoName
        );


      // ======================================================
      // ERREUR AUDIO
      // ======================================================

      audio.onerror =
        () => {

          let code =
            "inconnu";


          if (
            audio.error
          ) {

            code =
              audio.error.code;
          }


          debugLogger.log(
            `✗ ERREUR AUDIO : ${file} / code ${code}`,
            "error"
          );


          /*
           Codes HTMLMediaElement :

           1 = aborted
           2 = network
           3 = decode
           4 = source non supportée
          */


          if (
            this.safetyTimeout
          ) {

            clearTimeout(
              this.safetyTimeout
            );
          }


          videoManager
            .endReaction();


          state.isPlaying =
            false;
        };


      // ======================================================
      // AUDIO TERMINÉ
      // ======================================================

      audio.onended =
        () => {

          debugLogger.log(
            `✓ Audio terminé : ${file}`,
            "info"
          );


          if (
            this.safetyTimeout
          ) {

            clearTimeout(
              this.safetyTimeout
            );
          }


          videoManager
            .endReaction();


          state.isPlaying =
            false;
        };


      // ======================================================
      // FONCTION DE LECTURE
      // ======================================================

      let playAttempted =
        false;


      const startPlayback =
        () => {

          /*
           Safari peut envoyer plusieurs événements
           canplay / canplaythrough.

           On ne fait play() qu'une seule fois.
          */

          if (
            playAttempted
          ) {

            return;
          }


          playAttempted =
            true;


          debugLogger.log(
            `Audio prêt : ${file} / readyState=${audio.readyState}`,
            "success"
          );


          const playPromise =
            audio.play();


          if (
            playPromise &&
            playPromise.then
          ) {

            playPromise
              .then(() => {

                debugLogger.log(
                  `▶ AUDIO EN COURS : ${file}`,
                  "success"
                );

              })
              .catch(err => {

                debugLogger.log(
                  `✗ PLAY REFUSÉ : ${err.name} / ${err.message}`,
                  "error"
                );


                if (
                  err.name ===
                  "NotAllowedError"
                ) {

                  debugLogger.log(
                    "Safari bloque la lecture : un nouveau geste utilisateur est nécessaire.",
                    "error"
                  );
                }


                if (
                  this.safetyTimeout
                ) {

                  clearTimeout(
                    this.safetyTimeout
                  );
                }


                videoManager
                  .endReaction();


                state.isPlaying =
                  false;
              });
          }
        };


      // ======================================================
      // ÉVÉNEMENTS CHARGEMENT
      // ======================================================

      audio.onloadeddata =
        () => {

          debugLogger.log(
            `✓ Fichier audio chargé : ${file}`,
            "success"
          );
        };


      audio.oncanplay =
        () => {

          debugLogger.log(
            `✓ Audio canplay : ${file}`,
            "info"
          );


          startPlayback();
        };


      audio.oncanplaythrough =
        () => {

          debugLogger.log(
            `✓ Audio canplaythrough : ${file}`,
            "info"
          );


          startPlayback();
        };


      /*
       Si le navigateur avait déjà
       suffisamment chargé le fichier.
      */

      if (
        audio.readyState >= 3
      ) {

        startPlayback();

      } else {

        try {

          audio.load();

          debugLogger.log(
            `Chargement demandé : ${file}`,
            "audio"
          );

        } catch (err) {

          debugLogger.log(
            `Erreur audio.load() : ${err.message}`,
            "error"
          );
        }
      }
    }
  };

  const phraseDetector = {

    normalize(text) {

      return text
        .toLowerCase()
        .trim();
    },


    detect(text) {

      const t =
        this.normalize(text);

      const lang =
        state.currentLang;

      const audio =
        audioFiles[lang];


      debugLogger.log(
        `Analyse phrase (${lang}) : "${t}"`,
        "info"
      );


      // ======================================================
      // FRANÇAIS
      // ======================================================

      if (lang === "fr") {

        // Bonjour / salut
        if (
          /bonjour|salut|coucou|bonsoir|wesh|yo/i
            .test(t)
        ) {

          return {
            file: audio.bonjour,
            video: VIDEO.happy
          };
        }


        // Qui es-tu ?
        if (
          /qui (tu es|es-tu)|t'es qui|c'est quoi toi|astra|c'est quoi ce truc/i
            .test(t)
        ) {

          return {
            file: audio.qui,
            video: VIDEO.happy
          };
        }


        // Où sommes-nous ?
        if (
          /où sommes|on est où|quel est cet endroit/i
            .test(t)
        ) {

          return {
            file: audio.ou,
            video: VIDEO.anxious
          };
        }


        // Mot de passe
        if (
          /bonne nuit|le mot de passe c'est bonne nuit/i
            .test(t)
        ) {

          return this.handlePassword();
        }


        // Mot de passe oublié
        if (
          /mot de passe oublié|j'ai oublié|comment trouver/i
            .test(t)
        ) {

          return {
            file: audio.mdp_oublie,
            video: VIDEO.anxious
          };
        }


        // Pétunia
        if (
          /pétunia|petunia/i
            .test(t)
        ) {

          return {
            file: audio.petunia,
            video: VIDEO.angry
          };
        }


        // Parchemin
        if (
          /parchemin|marchemin|par chemin|potion.*libération|potion.*liberation|recette.*libération|recette.*liberation/i
            .test(t)
        ) {

          return this.handleParchemin();
        }


        // J'ai trouvé le mot de passe
        if (
          /je connais le mot de passe|j'ai trouvé le mot de passe/i
            .test(t)
        ) {

          return {
            file: audio.invite_mdp,
            video: VIDEO.anxious

            file: audio.ca_va,

          /prerecorded|pre-recorded/i
            .test(t)
        ) {

          return {
            file: audio.voix_preenregistree,
            video: VIDEO.suspicious
          };
        }


        // Help
        if (
          /hint|help|clue/i
            .test(t)
        ) {

          return {
            file: audio.indice_aide,
            video: VIDEO.suspicionAlt
          };
        }


        // What now?
        if (
          /what should we do|what do we do now|what to do now|what now/i
            .test(t)
        ) {

          return {
            file: audio.faire_quoi_mtn,
            video: VIDEO.walkTalk
          };
        }
      }


      // ======================================================
      // ALLEMAND
      // ======================================================

      if (lang === "de") {

        // Hallo
        if (
          /hallo|guten tag|guten morgen|guten abend|hey|hi/i
            .test(t)
        ) {

          return {
            file: audio.bonjour,
            video: VIDEO.happy
          };
        }


        // Wer bist du?
        if (
          /wer bist du|was bist du|wer ist astra|was ist das/i
            .test(t)
        ) {

          return {
            file: audio.qui,
            video: VIDEO.happy
          };
        }


        // Wo sind wir?
        if (
          /wo sind wir|wo ist dieser ort|was ist dieser ort/i
            .test(t)
        ) {

          return {
            file: audio.ou,
            video: VIDEO.anxious
          };
        }


        // Passwort
        if (
          /gute nacht|das passwort ist gute nacht/i
            .test(t)
        ) {

          return this.handlePassword();
        }


        // Passwort vergessen
        if (
          /passwort vergessen|ich habe.*vergessen|wie finde ich.*passwort/i
            .test(t)
        ) {

          return {
            file: audio.mdp_oublie,
            video: VIDEO.anxious
          };
        }


        // Petunie
        if (
          /petunie|petunia/i
            .test(t)
        ) {

          return {
            file: audio.petunia,
            video: VIDEO.angry
          };
        }


        // Pergament
        if (
          /pergament|schriftrolle|trank.*befreiung|rezept.*befreiung/i
            .test(t)
        ) {

          return this.handleParchemin();
        }


        // Passwort gefunden
        if (
          /ich kenne das passwort|ich habe das passwort gefunden/i
            .test(t)
        ) {

          return {
            file: audio.invite_mdp,
            video: VIDEO.anxious
          };
        }


        // Wie geht es dir?
        if (
          /wie geht es dir|wie geht's dir|geht es dir gut|alles gut/i
            .test(t)
        ) {

          return {
            file: audio.ca_va,
            video: VIDEO.happy
          };
        }


        // Bist du da?
        if (
          /bist du da|hörst du mich|horst du mich|kannst du mich hören|kannst du mich horen/i
            .test(t)
        ) {

          return {
            file: audio.tu_es_la,
            video: VIDEO.anxious
          };
        }


        // Wiegenlied
        if (
          /wiegenlied|schlafmusik/i
            .test(t)
        ) {

          return {
            file: audio.berceuse,
            video: VIDEO.talk
          };
        }


        // Glaubst du an uns?
        if (
          /glaubst du an uns|werden wir es schaffen|schaffen wir das/i
            .test(t)
        ) {

          return {
            file: audio.reve_croire,
            video: VIDEO.confident
          };
        }


        // Warum träumen Menschen nicht mehr?
        if (
          /warum träumen menschen nicht mehr|warum traumen menschen nicht mehr/i
            .test(t)
        ) {

          return {
            file: audio.pq_reve_plus,
            video: VIDEO.suspicionAlt
          };
        }


        // Morpheus
        if (
          /wer ist morpheus/i
            .test(t)
        ) {

          return {
            file: audio.qui_morpheus,
            video: VIDEO.walkTalk
          };
        }


        // Witz
        if (
          /witz|erzähl einen witz|erzahl einen witz|erzähl mir einen witz/i
            .test(t)
        ) {

          return this.handleJoke();
        }


        // Liebst du Morpheus?
        if (
          /liebst du morpheus|magst du morpheus|liebst du uns/i
            .test(t)
        ) {

          return {
            file: audio.tu_aime_morpheus,
            video: VIDEO.happy
          };
        }


        // Lösung
        if (
          /lösung|losung|antwort/i
            .test(t)
        ) {

          return {
            file: audio.la_solution,
            video: VIDEO.walkTalk
          };
        }


        // Kontrolle
        if (
          /kontrolle|kontrollierst|kontrollieren/i
            .test(t)
        ) {

          return {
            file: audio.c_toi_qui_controles,
            video: VIDEO.suspicious
          };
        }


        // Voraufgezeichnet
        if (
          /voraufgezeichnet|aufgezeichnete stimme/i
            .test(t)
        ) {

          return {
            file: audio.voix_preenregistree,
            video: VIDEO.suspicious
          };
        }


        // Hinweis / Hilfe
        if (
          /hinweis|hilfe|tipp/i
            .test(t)
        ) {

          return {
            file: audio.indice_aide,
            video: VIDEO.suspicionAlt
          };
        }


        // Was jetzt?
        if (
          /was sollen wir tun|was jetzt tun|was machen wir jetzt|was nun/i
            .test(t)
        ) {

          return {
            file: audio.faire_quoi_mtn,
            video: VIDEO.walkTalk
          };
        }
      }


      // ======================================================
      // PHRASE NON RECONNUE
      // ======================================================

      debugLogger.log(
        "Phrase comprise par Safari mais aucune intention correspondante",
        "warn"
      );


      return {

        file:
          utils.getRandomFromArray(
            audio.pas_compris
          ),

        video:
          VIDEO.anxious
      };
    },


    // ========================================================
    // MOT DE PASSE
    // ========================================================

    handlePassword() {

      const audio =
        audioFiles[
          state.currentLang
        ];


      // Première validation
      if (
        !state.mdpValid
      ) {

        debugLogger.log(
          "✓ MOT DE PASSE CORRECT",
          "success"
        );


        state.mdpValid =
          true;


        // Cache le bandeau
        elements.bandeau
          .style.display =
          "none";


        /*
         IMPORTANT :

         On RETOURNE la première réponse au lieu
         d'appeler audioManager.play() ici.

         Cela permet à onresult de gérer
         proprement la première lecture.
        */

        this.startPasswordSequence();


        return {

          file:
            audio.mdp,

          video:
            VIDEO.happy
        };
      }


      // Déjà validé
      return {

        file:
          audio.mdp,

        video:
          VIDEO.walkTalk
      };
    },


    // ========================================================
    // SÉQUENCE APRÈS MOT DE PASSE
    // ========================================================

    startPasswordSequence() {

      const audio =
        audioFiles[
          state.currentLang
        ];


      /*
       On attend suffisamment longtemps pour
       laisser mdp_confirme.mp3 se terminer.

       L'ancien code lançait une deuxième lecture
       après seulement 3 secondes.

       Si la première réponse faisait plus de
       3 secondes, elle pouvait être ignorée à
       cause de state.isPlaying.

       Ici on attend que le lecteur soit libre.
      */

      const waitForFirstAudio =
        () => {

          if (
            state.isPlaying
          ) {

            setTimeout(
              waitForFirstAudio,
              300
            );

            return;
          }


          debugLogger.log(
            "Début séquence magique mot de passe",
            "info"
          );


          // Particules
          magicEffects.cascade(
            40,
            150
          );


          // Notification Astra
          audioManager.play(
            audio.notif,
            VIDEO.walkTalk
          );


          // Transition visuelle
          elements.fade
            .style.opacity =
            "1";


          setTimeout(
            () => {

              elements.astraIdle
                .classList
                .remove("active");


              videoManager.activateIdle(
                elements.astraIdle2
              );


              elements.fade
                .style.opacity =
                "0";

            },
            1500
          );
        };


      /*
       On laisse onresult démarrer le MP3
       de confirmation avant de commencer
       à vérifier state.isPlaying.
      */

      setTimeout(
        waitForFirstAudio,
        300
      );
    },


    // ========================================================
    // PARCHEMIN
    // ========================================================

    handleParchemin() {

      const audio =
        audioFiles[
          state.currentLang
        ];


      if (
        state.mdpValid
      ) {

        debugLogger.log(
          "Affichage du parchemin",
          "success"
        );


        parcheminManager.show(
          15000
        );


        const video =
          PARCHEMIN_VIDEO[
            state.currentLang
          ]
          || VIDEO.read;


        return {

          file:
            audio.parchemin,

          video:
            video
        };
      }


      // Pas encore de mot de passe
      debugLogger.log(
        "Parchemin demandé avant validation du mot de passe",
        "warn"
      );


      const faux =
        utils.getRandomFromArray(
          audio.mdp_faux
        );


      return {

        file:
          faux,

        video:
          VIDEO.angry
      };
    },


    // ========================================================
    // BLAGUE
    // ========================================================

    handleJoke() {

      const audio =
        audioFiles[
          state.currentLang
        ];


      /*
       Même principe que le mot de passe :
       on retourne la blague normalement.

       Puis le rire sera joué quand
       la première piste sera terminée.
      */

      const waitForJokeEnd =
        () => {

          if (
            state.isPlaying
          ) {

            setTimeout(
              waitForJokeEnd,
              250
            );

            return;
          }


          audioManager.play(
            audio.rire,
            VIDEO.happy
          );
        };


      setTimeout(
        waitForJokeEnd,
        500
      );


      return {

        file:
          audio.blague,

        video:
          VIDEO.joy
      };
    }
  };
    // ==========================================================
  // RECONNAISSANCE VOCALE
  // ==========================================================

  const speechRecognition = {

    getLangCode() {

      const codes = {

        fr:
          "fr-FR",

        en:
          "en-US",

        de:
          "de-DE"
      };


      return (
        codes[state.currentLang]
        || "fr-FR"
      );
    },


    // ========================================================
    // INITIALISATION
    // ========================================================

    init() {

      const SpeechRecognition =
        window.SpeechRecognition
        || window.webkitSpeechRecognition;


      if (
        !SpeechRecognition
      ) {

        debugLogger.log(
          "SpeechRecognition non disponible",
          "error"
        );


        utils.showError(
          translations[
            state.currentLang
          ].errorSpeechNotSupported,
          5000
        );


        return false;
      }


      debugLogger.log(
        "API SpeechRecognition disponible",
        "success"
      );


      /*
       Si une ancienne reconnaissance existe,
       on essaye de l'arrêter proprement.
      */

      if (
        state.recognition
      ) {

        try {

          state.recognition.abort();

        } catch (_) {}
      }


      // Nouvelle instance
      state.recognition =
        new SpeechRecognition();


      /*
       IMPORTANT iOS :

       continuous=true fonctionne différemment
       selon les versions de Safari.

       Même avec continuous=true, Safari peut
       arrêter la reconnaissance.

       C'est pour cela que onend la relance.
      */

      state.recognition.continuous =
        true;


      state.recognition.interimResults =
        false;


      state.recognition.maxAlternatives =
        1;


      state.recognition.lang =
        this.getLangCode();


      debugLogger.log(
        `Langue SpeechRecognition : ${state.recognition.lang}`,
        "info"
      );


      // ======================================================
      // START
      // ======================================================

      state.recognition.onstart =
        () => {

          state.recognitionRunning =
            true;


          state.needsGestureRestart =
            false;


          debugLogger.log(
            "🎙️ Reconnaissance vocale démarrée",
            "success"
          );


          utils.updateStatus(
            "listening",
            true
          );
        };


      // ======================================================
      // SPEECH START
      // ======================================================

      state.recognition.onspeechstart =
        () => {

          debugLogger.log(
            "🎙️ Voix détectée",
            "speech"
          );
        };


      // ======================================================
      // SPEECH END
      // ======================================================

      state.recognition.onspeechend =
        () => {

          debugLogger.log(
            "Fin de phrase détectée",
            "speech"
          );
        };


      // ======================================================
      // RÉSULTAT
      // ======================================================

      state.recognition.onresult =
        event => {

          try {

            /*
             On récupère toujours
             le dernier résultat.
            */

            const result =
              event.results[
                event.results.length - 1
              ];


            const alternative =
              result[0];


            const text =
              alternative.transcript
                .trim();


            const confidence =
              typeof alternative.confidence ===
              "number"
                ? alternative.confidence
                : 0;


            debugLogger.log(
              `🎙️ Entendu : "${text}"`,
              "speech"
            );


            debugLogger.log(
              `Confiance : ${Math.round(confidence * 100)}%`,
              "info"
            );


            debugLogger.log(
              `Langue active : ${state.currentLang}`,
              "info"
            );


            /*
             Détection de l'intention.
            */

            const response =
              phraseDetector.detect(
                text
              );


            if (
              response &&
              response.file
            ) {

              debugLogger.log(
                `✓ Réponse trouvée : ${response.file}`,
                "success"
              );


              audioManager.play(
                response.file,
                response.video
              );

            } else {

              debugLogger.log(
                "Aucun fichier audio retourné",
                "warn"
              );
            }

          } catch (err) {

            debugLogger.log(
              `Erreur traitement résultat vocal : ${err.message}`,
              "error"
            );
          }
        };


      // ======================================================
      // ERREURS
      // ======================================================

      state.recognition.onerror =
        event => {

          const error =
            event.error
            || "inconnue";


          debugLogger.log(
            `Erreur reconnaissance : ${error}`,
            "error"
          );


          /*
           no-speech :

           Personne n'a parlé pendant
           un certain temps.

           Ce n'est pas grave.
          */

          if (
            error === "no-speech"
          ) {

            debugLogger.log(
              "Aucune parole détectée — relance prévue",
              "info"
            );

            return;
          }


          /*
           aborted :

           Arrêt volontaire ou Safari.
           Pas forcément une vraie erreur.
          */

          if (
            error === "aborted"
          ) {

            debugLogger.log(
              "Reconnaissance interrompue",
              "warn"
            );

            return;
          }


          /*
           not-allowed :

           Permission micro refusée
           OU Safari refuse une relance
           sans geste utilisateur.
          */

          if (
            error === "not-allowed"
          ) {

            state.needsGestureRestart =
              true;


            debugLogger.log(
              "⚠️ Safari demande un nouveau geste utilisateur pour le micro",
              "warn"
            );


            utils.updateStatus(
              "micDisabled",
              false
            );


            return;
          }


          /*
           audio-capture :

           Aucun micro disponible.
          */

          if (
            error === "audio-capture"
          ) {

            utils.updateStatus(
              "micError",
              false
            );


            debugLogger.log(
              "Impossible d'accéder au microphone",
              "error"
            );


            return;
          }


          /*
           network :

           Web Speech peut dépendre
           d'un service distant.
          */

          if (
            error === "network"
          ) {

            debugLogger.log(
              "Erreur réseau SpeechRecognition",
              "error"
            );


            utils.updateStatus(
              "micError",
              false
            );


            return;
          }


          // Autre erreur
          utils.updateStatus(
            "micError",
            false
          );
        };


      // ======================================================
      // FIN DE RECONNAISSANCE
      // ======================================================

      state.recognition.onend =
        () => {

          state.recognitionRunning =
            false;


          debugLogger.log(
            "Reconnaissance vocale arrêtée",
            "info"
          );


          /*
           Arrêt volontaire lors
           d'un changement de langue.
          */

          if (
            state.manualStop
          ) {

            state.manualStop =
              false;


            debugLogger.log(
              "Arrêt volontaire — pas de restart automatique",
              "info"
            );


            return;
          }


          /*
           Si Safari a explicitement demandé
           un geste utilisateur, on ne boucle
           surtout pas sur start().
          */

          if (
            state.needsGestureRestart
          ) {

            debugLogger.log(
              "En attente d'un tap pour relancer le micro",
              "warn"
            );


            return;
          }


          /*
           Si l'expérience n'est pas démarrée,
           rien à faire.
          */

          if (
            !state.started
          ) {

            return;
          }


          /*
           Safari coupe régulièrement
           SpeechRecognition.

           On tente donc une relance.
          */

          setTimeout(
            () => {

              if (
                !state.started
                ||
                state.needsGestureRestart
              ) {

                return;
              }


              debugLogger.log(
                "Tentative de relance automatique du micro...",
                "info"
              );


              this.start();

            },
            700
          );
        };


      return true;
    },


    // ========================================================
    // CHANGEMENT LANGUE
    // ========================================================

    updateLanguage() {

      if (
        !state.recognition
      ) {

        return;
      }


      state.recognition.lang =
        this.getLangCode();


      debugLogger.log(
        `Langue reconnaissance mise à jour : ${state.recognition.lang}`,
        "info"
      );
    },


    // ========================================================
    // START
    // ========================================================

    start() {

      if (
        !state.recognition
      ) {

        debugLogger.log(
          "Impossible de démarrer : reconnaissance inexistante",
          "error"
        );

        return;
      }


      /*
       Évite un double start().
      */

      if (
        state.recognitionRunning
      ) {

        debugLogger.log(
          "Reconnaissance déjà active",
          "info"
        );

        return;
      }


      try {

        state.recognition.start();


        debugLogger.log(
          "Commande recognition.start() envoyée",
          "info"
        );

      } catch (err) {

        /*
         Safari peut renvoyer InvalidStateError
         si la reconnaissance est encore
         techniquement active.
        */

        debugLogger.log(
          `Erreur recognition.start() : ${err.name} / ${err.message}`,
          "error"
        );


        if (
          err.name !==
          "InvalidStateError"
        ) {

          state.needsGestureRestart =
            true;
        }
      }
    }
  };


  // ==========================================================
  // MODE STAFF + PREMIER TAP
  // ==========================================================

  let staffTapCount =
    0;


  let staffTapTimer =
    null;


  elements.staffTapZone.addEventListener(
    "click",
    () => {

      // ======================================================
      // PREMIER TAP
      // ======================================================

      if (
        !state.started
      ) {

        state.started =
          true;


        debugLogger.log(
          "👆 Premier tap staff détecté",
          "success"
        );


        /*
         ======================================================
         TRÈS IMPORTANT POUR iPadOS
         ======================================================

         Ces opérations sont déclenchées
         directement depuis le clic :

         1. déblocage audio
         2. démarrage vidéo
         3. initialisation du système

         Cela donne à Safari un vrai
         geste utilisateur.
        */


        // ----------------------------------------------------
        // 1. AUDIO
        // ----------------------------------------------------

        audioManager.unlock();


        // ----------------------------------------------------
        // 2. VIDÉO
        // ----------------------------------------------------

        try {

          elements.astraIdle.muted =
            true;


          elements.astraIdle.style.display =
            "block";


          elements.astraIdle
            .classList
            .add("active");


          const videoPromise =
            elements.astraIdle.play();


          if (
            videoPromise &&
            videoPromise.then
          ) {

            videoPromise
              .then(() => {

                debugLogger.log(
                  "✓ Vidéo principale débloquée",
                  "success"
                );

              })
              .catch(err => {

                debugLogger.log(
                  `Vidéo initiale refusée : ${err.message}`,
                  "warn"
                );

              });
          }

        } catch (err) {

          debugLogger.log(
            `Erreur vidéo initiale : ${err.message}`,
            "warn"
          );
        }


        // ----------------------------------------------------
        // 3. APPLICATION
        // ----------------------------------------------------

        /*
         Contrairement à la version précédente,
         on initialise SpeechRecognition
         immédiatement depuis le clic.

         Safari est plus susceptible
         d'accepter le micro ainsi.
        */

        app.init();


        return;
      }


      // ======================================================
      // TAPS SUIVANTS = MODE STAFF
      // ======================================================

      staffTapCount++;


      clearTimeout(
        staffTapTimer
      );


      staffTapTimer =
        setTimeout(
          () => {

            staffTapCount =
              0;

          },
          2000
        );


      if (
        staffTapCount >= 5
      ) {

        document.body
          .classList
          .toggle(
            "staffMode"
          );


        staffTapCount =
          0;


        debugLogger.log(

          document.body
            .classList
            .contains(
              "staffMode"
            )

            ? "Mode staff activé"

            : "Mode staff désactivé",

          "info"
        );
      }
    }
  );


  // ==========================================================
  // TAP DE SECOURS iOS
  // ==========================================================

  /*
   Si Safari coupe le micro et refuse
   de le relancer automatiquement,
   n'importe quel touch sur l'écran
   permet de tenter une relance.

   Cette fonction ne fait RIEN
   si le micro fonctionne normalement.
  */

  document.addEventListener(
    "touchstart",
    () => {

      if (
        !state.started
      ) {

        return;
      }


      if (
        !state.needsGestureRestart
      ) {

        return;
      }


      debugLogger.log(
        "👆 Tap détecté : tentative de réveil du micro iOS",
        "info"
      );


      state.needsGestureRestart =
        false;


      /*
       On redébloque aussi le lecteur audio
       pendant ce nouveau geste utilisateur.
      */

      audioManager.unlock();


      // Puis le micro
      if (
        state.recognition
      ) {

        speechRecognition.start();

      } else {

        if (
          speechRecognition.init()
        ) {

          speechRecognition.start();
        }
      }
    },
    {
      passive: true
    }
  );


  // ==========================================================
  // RETOUR SUR LA PAGE
  // ==========================================================

  /*
   Quand l'iPad passe en veille,
   change d'application ou masque Safari,
   SpeechRecognition peut mourir.

   On vérifie donc lorsque la page
   redevient visible.
  */

  document.addEventListener(
    "visibilitychange",
    () => {

      if (
        document.visibilityState !==
        "visible"
      ) {

        debugLogger.log(
          "Page passée en arrière-plan",
          "info"
        );

        return;
      }


      debugLogger.log(
        "Page redevenue visible",
        "info"
      );


      if (
        !state.started
      ) {

        return;
      }


      /*
       On laisse Safari se réveiller
       avant de vérifier le micro.
      */

      setTimeout(
        () => {

          if (
            !state.recognitionRunning
            &&
            !state.needsGestureRestart
          ) {

            debugLogger.log(
              "Micro inactif après retour page — tentative de restart",
              "info"
            );


            speechRecognition.start();
          }

        },
        1000
      );
    }
  );


  // ==========================================================
  // INITIALISATION APPLICATION
  // ==========================================================

  const app = {

    initialized:
      false,


    init() {

      /*
       Évite une double initialisation.
      */

      if (
        this.initialized
      ) {

        debugLogger.log(
          "Application déjà initialisée",
          "warn"
        );

        return;
      }


      this.initialized =
        true;


      try {

        debugLogger.log(
          "Initialisation Astra...",
          "info"
        );


        // ----------------------------------------------------
        // VIDÉOS
        // ----------------------------------------------------

        videoManager.setupLoops();


        debugLogger.log(
          "✓ Vidéos configurées",
          "success"
        );


        // ----------------------------------------------------
        // LANGUES
        // ----------------------------------------------------

        languageManager.init();


        debugLogger.log(
          `✓ Langue par défaut : ${state.currentLang}`,
          "success"
        );


        // ----------------------------------------------------
        // IDLE
        // ----------------------------------------------------

        videoManager.activateIdle(
          elements.astraIdle
        );


        // ----------------------------------------------------
        // RECONNAISSANCE VOCALE
        // ----------------------------------------------------

        if (
          speechRecognition.init()
        ) {

          debugLogger.log(
            "✓ Reconnaissance initialisée",
            "success"
          );


          /*
           IMPORTANT :

           start() arrive toujours dans
           la chaîne du clic staff initial.
          */

          speechRecognition.start();


          utils.updateStatus(
            "ready",
            true
          );


          utils.hideStatus(
            3000
          );


          debugLogger.log(
            "★★★★★ ASTRA EST PRÊTE ★★★★★",
            "success"
          );

        } else {

          debugLogger.log(
            "Reconnaissance vocale indisponible",
            "error"
          );


          utils.showError(
            translations[
              state.currentLang
            ].errorSpeechNotAvailable,
            5000
          );
        }

      } catch (err) {

        debugLogger.log(
          `ERREUR INITIALISATION : ${err.name} / ${err.message}`,
          "error"
        );


        console.error(
          "Erreur initialisation Astra :",
          err
        );


        utils.showError(
          translations[
            state.currentLang
          ].errorMicDenied,
          5000
        );


        utils.updateStatus(
          "errorInit",
          false
        );
      }
    }
  };


  // ==========================================================
  // CHARGEMENT DE LA PAGE
  // ==========================================================

  window.addEventListener(
    "load",
    () => {

      utils.updateBandeau();


      debugLogger.log(
        "================================",
        "info"
      );


      debugLogger.log(
        "ASTRA — VERSION iPad / Safari",
        "info"
      );


      debugLogger.log(
        "Page chargée",
        "success"
      );


      debugLogger.log(
        "En attente du premier tap staff...",
        "info"
      );


      debugLogger.log(
        "================================",
        "info"
      );
    }
  );


  // ==========================================================
  // ERREURS JAVASCRIPT GLOBALES
  // ==========================================================

  window.addEventListener(
    "error",
    event => {

      debugLogger.log(
        `ERREUR JS : ${event.message} — ligne ${event.lineno}`,
        "error"
      );
    }
  );


  // ==========================================================
  // PROMESSES REJETÉES
  // ==========================================================

  window.addEventListener(
    "unhandledrejection",
    event => {

      const reason =
        event.reason;


      let message =
        "Erreur Promise inconnue";


      if (
        reason
      ) {

        if (
          reason.name
          ||
          reason.message
        ) {

          message =
            `${reason.name || "Error"} / ${reason.message || reason}`;

        } else {

          message =
            String(reason);
        }
      }


      debugLogger.log(
        `PROMISE REJETÉE : ${message}`,
        "error"
      );
    }
  );

</script>

</body>
</html>
