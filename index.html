// ============================================================
// TEXTES
// ============================================================

};

};

// ============================================================
// PHRASES COMPRISES  (texte normalisé : minuscules, sans accents ni ponctuation)
// L'ordre compte : le premier qui correspond gagne.
// ============================================================
const PASSWORD = {fr:/\bbonne nuit\b/, en:/\bgood night\b/, de:/\bgute nacht\b/};
const PASSWORD_DENIED = {
  fr:/\b(pas|jamais)\b.*\bbonne nuit\b|\bbonne nuit\b.*\bpas\b/,
  en:/\bnot\b.*\bgood night\b|\bgood night\b.*\bnot\b/,

};

const DENY_CMD = {
  fr:/\b(ne |n )?(donne|donnez|affiche|montre|ouvre|repete|chante|raconte)\s+(\w+\s+){0,2}(pas|plus|jamais)\b|\b(veux|veut|voulons)\s+pas\b/,
  en:/\b(do not|don t|never)\s+(show|give|open|repeat|sing|tell)\b/,
  de:/\b(zeig|zeige|offne|wiederhole|sing|singe)\b.*\b(nicht|kein|keine)\b/
};

const INTENTS = {
  fr:[
    ['repeat',/\b(repete|repeter|redis|redire|recommence|encore une fois|pas entendu|mal entendu)\b/],
    ['mdp_oublie',/\b(mot de passe|code secret)\b.*\b(ou|trouver|sais pas|connait pas|connais pas|oublie|quoi|quel)\b|\bpas (encore )?trouve\b.*\b(mot de passe|code secret)\b|\b(mot de passe|code secret)\b.*\bpas (encore )?trouve\b|\b(ou|quel|quoi|oublie|trouver)\b.*\b(mot de passe|code secret)\b|\bj ai oublie\b|\bon a oublie\b/],

    ['berceuse',/\b(aide|aides|aidez) nous a (dormir|nous endormir)\b|\bendors nous\b/],
    ['indice_aide',/\b(aide|aider|aidez|aides|secours|indices?|bloque|bloques|coince|coinces|comprend pas|comprends pas|chaudron)\b/],
    ['morpheus_apparence',/\b(ressemble|apparence)\b.*\bmorpheus\b|\bmorpheus\b.*\b(ressemble|apparence)\b/],
    ['tu_aime_morpheus',/\btu (aime|aimes) (morpheus|nous)\b/],
    ['qui_morpheus',/\b(qui|presente|parle)\b.*\b(morpheus|morphee|morfeus)\b/],
    ['qui',/\b(qui es tu|qui tu es|tu es qui|t es qui|comment tu t appelles|ton nom|presente toi|qui est astra|c est quoi astra)\b/],
    ['ou',/\b(ou on est|on est ou|ou est on|ou sommes nous|ou nous sommes|quel endroit|quelle salle|cet endroit)\b/],
    ['petunia',/\bpetunia\b/],
    ['tu_es_la',/\b(tu entends|tu m entends|tu nous entends|tu es la|t es la|he ho|hey ho|reponds|repond|ecoute nous)\b/],
    ['ca_va',/\b(comment vas tu|comment tu vas|comment allez vous|ca va|tu vas bien|tout va bien)\b/],
    ['berceuse',/\b(berceuse|chante|chanter|chanson|endors nous|aide nous a dormir|musique pour dormir)\b/],
    ['blague',/\b(blagues?|fais nous rire|fais moi rire|raconte un truc drole)\b/],
    ['reve_croire',/\b(on peut reussir|on va y arriver|on va reussir|tu nous fais confiance|tu crois en nous|crois tu en nous)\b/],
    ['pq_reve_plus',/\bpourquoi\b.*\b(ne revent plus|ne reve plus|revent plus|reve plus)\b/],
    ['la_solution',/\b(solution|donne.*reponse)\b/],
    ['c_toi_qui_controles',/\b(controle|controles)\b/],
    ['voix_preenregistree',/\b(preenregistree|pre enregistree|voix enregistree)\b/],
    ['bonjour',/\b(bonjour|salut|coucou|bonsoir|wesh|yo|hello|hey)\b/]
  ],
  en:[
    ['repeat',/\b(repeat|say that again|say it again|didn t hear|couldn t hear|one more time)\b/],
    ['mdp_oublie',/\b(where|what|forgot|forgotten|find)\b.*\bpassword\b/],
    ['invite_mdp',/\b(i|we) (know|found)\b.*\bpassword\b/],
    ['scroll',/\b(scrolls?|parchment|recipe|free him|release him|open the cage)\b/],
    ['faire_quoi_mtn',/\b(what next|what do we do|what should we do|where do we start|what now|what are we supposed to do)\b/],
    ['indice_aide',/\b(help|hint|clue|stuck|cauldron)\b/],
    ['morpheus_apparence',/\b(what does morpheus look like|morpheus appearance|describe morpheus)\b/],
    ['tu_aime_morpheus',/\b(do you (love|like) (morpheus|us))\b/],
    ['qui_morpheus',/\bwho (is|s) morpheus\b/],
    ['qui',/\b(who are you|what are you|who is astra|what is this)\b/],
    ['ou',/\b(where are we|where is this place|what is this place)\b/],
    ['petunia',/\bpetunia\b/],
    ['tu_es_la',/\b(are you there|you there|can you hear me|can you hear us)\b/],
    ['ca_va',/\b(how are you|are you ok|are you okay|you good)\b/],
    ['berceuse',/\b(lullaby|sleep music|music to sleep|sing)\b/],
    ['blague',/\b(joke)\b/],
    ['reve_croire',/\b(do you believe in us|will we succeed|can we succeed)\b/],
    ['pq_reve_plus',/\bwhy\b.*\bdream\b/],
    ['la_solution',/\b(solution|answer)\b/],
    ['c_toi_qui_controles',/\b(control|controlling)\b/],
    ['voix_preenregistree',/\b(prerecorded|pre recorded|recorded voice)\b/],
    ['bonjour',/\b(hello|hi|hey|good morning|good evening|yo)\b/]
  ],
  de:[
    ['repeat',/\b(wiederholen|wiederhole|noch einmal|nochmal|nicht gehort|nicht verstanden)\b/],
    ['mdp_oublie',/\b(wo|was|vergessen)\b.*\bpasswort\b|\bpasswort\b.*\bvergessen\b/],
    ['invite_mdp',/\b(ich kenne|haben)\b.*\bpasswort\b/],
    ['scroll',/\b(schriftrolle|pergament|rezept|befreien|befreiung|kafig offnen)\b/],
    ['faire_quoi_mtn',/\b(wie geht es weiter|was sollen wir (tun|machen)|was jetzt tun|was machen wir jetzt|was nun|wo fangen wir an)\b/],
    ['indice_aide',/\b(hilfe|helfen|hinweis|tipp|kessel|hilf uns)\b/],
    ['morpheus_apparence',/\b(wie sieht morpheus aus|aussehen.*morpheus|beschreibe morpheus)\b/],
    ['tu_aime_morpheus',/\b(liebst du|magst du) (morpheus|uns)\b/],
    ['qui_morpheus',/\bwer ist morpheus\b/],
    ['qui',/\b(wer bist du|was bist du|wer ist astra|was ist das)\b/],
    ['ou',/\b(wo sind wir|wo ist dieser ort)\b/],
    ['petunia',/\b(petunia|petunie)\b/],
    ['tu_es_la',/\b(bist du da|horst du (mich|uns)|kannst du (mich|uns) horen)\b/],
    ['ca_va',/\b(wie geht es dir|wie geht s dir|alles gut)\b/],
    ['berceuse',/\b(wiegenlied|schlafmusik|sing)\b/],
    ['blague',/\b(witz)\b/],
    ['reve_croire',/\b(glaubst du an uns|werden wir es schaffen|schaffen wir das)\b/],
    ['pq_reve_plus',/\bwarum\b.*\btraumen\b/],
    ['la_solution',/\b(losung|antwort)\b/],
    ['c_toi_qui_controles',/\b(kontrolle|kontrollierst|kontrollieren)\b/],
    ['voix_preenregistree',/\b(voraufgezeichnet|aufgezeichnete stimme)\b/],
    ['bonjour',/\b(hallo|guten tag|guten morgen|guten abend|hey|hi)\b/]
  ]
};

// Vidéo associée à chaque réponse (une fois Astra déverrouillée)
const VIDEO_OF = {
  bonjour:V.happy, qui:V.happy, ou:V.anxious, mdp_oublie:V.anxious, petunia:V.angry, invite_mdp:V.anxious,
  ca_va:V.happy, tu_es_la:V.anxious, berceuse:V.talk, reve_croire:V.confident, pq_reve_plus:V.suspicionAlt,
  qui_morpheus:V.walkTalk, morpheus_apparence:V.suspicionAlt, tu_aime_morpheus:V.happy, la_solution:V.walkTalk,
  c_toi_qui_controles:V.suspicious, voix_preenregistree:V.suspicious, indice_aide:V.suspicionAlt, faire_quoi_mtn:V.walkTalk
};
// Avant le mot de passe, Astra ne répond qu'à ça (le reste est ignoré)
const LOCKED_OK = ['bonjour','indice_aide','mdp_oublie','invite_mdp','tu_es_la'];

const norm = s => s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'')
  .replace(/[’'\-]/g,' ').replace(/[.,!?;:…]/g,' ').replace(/\s+/g,' ').trim();

// ============================================================
// DÉTECTION → renvoie {file, video, after?} ou null
// ============================================================
function detect(text, final){
  const lang = S.lang, t = norm(text), files = A(lang);
  log(`Phrase (${lang}) : "${t}"`);

  if (PASSWORD[lang].test(t)) {
    if (PASSWORD_DENIED[lang].test(t)) return null;
    return handlePassword(files);
  }

  if (DENY_CMD[lang].test(t)) return null;
  const found = INTENTS[lang].find(([,re]) => re.test(t));
  const k = found && found[0];

  if (k === 'repeat') return S.last;

  if (!S.unlocked) {
    if (!k || !LOCKED_OK.includes(k)) return null;
    return {file:files[k], video: k === 'bonjour' ? V.happy : V.cauldron};
  }

  if (k === 'scroll') return {file:files.parchemin, video:null};   // null = parchemin vidéo
  if (k === 'blague') {
    S.queue.push({file:files.rire, video:V.happy});               // rire après la blague
    return {file:files.blague, video:V.joy};
  }
  if (k) return {file:files[k], video:VIDEO_OF[k]};

  // Phrase non reconnue : on répond seulement si la reco est assez sûre
  const words = text.trim().split(/\s+/).length;
  if (!final || S.lastConf < 0.55 || words < 2) return null;
  const arr = NOT_UNDERSTOOD[lang];
  return {file:arr[Math.floor(Math.random()*arr.length)] + '.mp3', video:V.anxious};
}

function handlePassword(files){
  if (!S.unlocked) {
    S.unlocked = true;
    clearTimeout(S.hintTimer);
    document.body.classList.add('passwordFound');
    $('bandeau').textContent = BANDEAU_OK[S.lang];
    S.queue.push({file:files.notif, video:V.walkTalk, before:transformation});
    return {file:files.mdp, video:V.happy};
  }
  return {file:files.mdp, video:V.walkTalk};
}

// ============================================================
// VIDÉOS
// ============================================================
const idle1 = $('astraIdle'), idle2 = $('astraIdle2'), reaction = $('astraReaction'), scrollVid = $('parcheminImage');
let scrollActive = false;

function showIdle(){
  if (scrollActive || NOVIDEO) return;
  const on = S.unlocked ? idle2 : idle1, off = S.unlocked ? idle1 : idle2;
  off.pause(); off.style.display = 'none';
  on.style.display = 'block'; on.muted = true;
  on.play().catch(()=>{});
}
function showReaction(src, loop=true){
  idle1.pause(); idle2.pause();
  reaction.classList.toggle('hint', src === V.cauldron);
  reaction.loop = loop;
  reaction.src = src;
  reaction.style.display = 'block';
  reaction.currentTime = 0;
  reaction.muted = true;
  return reaction.play().catch(e => log('Vidéo refusée : ' + e.message));
}
function endReaction(){
  reaction.pause();
  reaction.style.display = 'none';
  reaction.onended = null;
  showIdle();
}

// ============================================================
// LECTURE D'UNE RÉPONSE (audio + vidéo)
// ============================================================
const voice = new Audio();
let guard = null;

function play(it){
  if (S.playing) return;
  S.playing = true;
  S.last = {file:it.file, video:it.video};
  reaction.onended = null;
  if (it.before) it.before();

  const isScroll = it.video === null;
  let pending = isScroll ? 2 : 1, finished = {};
  const part = name => {
    if (finished[name]) return; finished[name] = true;
    if (--pending > 0) return;
    clearTimeout(guard);
    voice.onended = voice.onerror = null;
    if (isScroll) hideScroll();
    endReaction();
    S.playing = false;
    const next = S.queue.shift();
    if (next) setTimeout(() => play(next), 150);
  };

  voice.onended = () => part('audio');
  voice.onerror = () => { log('Audio introuvable : ' + it.file); part('audio'); if (isScroll) part('video'); };
  clearTimeout(guard);
  guard = setTimeout(() => { part('audio'); part('video'); }, 90000);

  if (isScroll) showScroll(() => part('video')); else showReaction(it.video);

  if (voice.getAttribute('src') !== it.file) voice.src = it.file;
  voice.volume = 1;
  voice.play().catch(e => { log('Lecture audio refusée : ' + e.message); part('audio'); if (isScroll) part('video'); });
}

function showScroll(onDone){
  scrollActive = true;
  [idle1, idle2, reaction].forEach(v => { v.pause(); v.style.display = 'none'; });
  document.querySelectorAll('.magic').forEach(p => p.remove());
  const f = PARCHEMIN[S.lang];
  if (scrollVid.getAttribute('src') !== f) scrollVid.src = f;
  scrollVid.style.display = 'block';
  scrollVid.muted = true;
  scrollVid.currentTime = 0;
  scrollVid.onended = onDone;
  scrollVid.onerror = onDone;
  scrollVid.play().catch(onDone);
}
function hideScroll(){
  scrollVid.onended = scrollVid.onerror = null;
  scrollVid.pause();
  scrollVid.style.display = 'none';
  scrollActive = false;
}

// ============================================================
// TRANSFORMATION APRÈS LE MOT DE PASSE
// ============================================================
function transformation(){
  for (let i = 0; i < 16; i++) setTimeout(() => {
    if (scrollActive) return;
    const p = document.createElement('div');
    p.className = 'magic';
    p.style.left = Math.random()*100 + 'vw';
    p.style.top = '-40px';
    p.style.animationDuration = (3 + Math.random()*5) + 's';
    document.body.appendChild(p);
    setTimeout(() => p.remove(), 8000);
  }, i*160);
  $('fade').style.opacity = '1';
  setTimeout(() => { $('fade').style.opacity = '0'; }, 1500);
}

// ============================================================
// INDICE AUTOMATIQUE : chaudron après 5 min sans mot de passe
// ============================================================
function scheduleHint(delay = 5*60*1000){
  clearTimeout(S.hintTimer);
  S.hintTimer = setTimeout(() => {
    if (!S.started || S.unlocked) return;
    if (S.playing || document.visibilityState === 'hidden') return scheduleHint(1000);
    S.playing = true;
    let done = false;
    const end = () => { if (done) return; done = true; clearTimeout(g); reaction.onended = null; endReaction(); S.playing = false; };
    const g = setTimeout(end, 120000);
    reaction.onended = end;
    reaction.onerror = end;
    showReaction(V.cauldron, false).then(() => {});
  }, delay);
}

// ============================================================
// RECONNAISSANCE VOCALE
// ============================================================
// Devine la réponse probable SANS rien modifier (sert au préchargement et à la réponse rapide)
function peek(text){
  const lang = S.lang, t = norm(text), files = A(lang);
  if (PASSWORD[lang].test(t)) return PASSWORD_DENIED[lang].test(t) ? null : files.mdp;
  const found = INTENTS[lang].find(([,re]) => re.test(t));
  const k = found && found[0];
  if (!k) return null;
  if (k === 'repeat') return S.last ? S.last.file : null;
  if (!S.unlocked && !LOCKED_OK.includes(k)) return null;
  if (k === 'scroll') return files.parchemin;
  return files[k] || null;
}
function prepareAudio(file){
  if (!file || S.playing) return;
  if (voice.getAttribute('src') === file) return;
  voice.preload = 'auto';
  voice.src = file;
  voice.load();
}

function handle(text, final){
  if (S.consumed || S.playing) return;
  try {
    const res = detect(text, final);
    if (res) {
      S.consumed = true;           // une seule réponse par session d'écoute
      play(res);
    }
  } catch (err) {
    log('ERREUR dans handle/play : ' + err.name + ' / ' + err.message);
    S.playing = false;
    try { endReaction(); } catch (_) {}
  }
}

function initRecognition(){
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) { log('SpeechRecognition NON disponible'); return false; }
  const r = new SR();
  r.continuous = false;
  r.interimResults = true;
  r.maxAlternatives = 1;
  r.lang = LANG_CODE[S.lang];

  r.onstart = () => {
    clearTimeout(S.startTimer);
    S.running = true; S.starting = false; S.needGesture = false;
    S.consumed = false; S.lastText = ''; S.lastConf = 0; clearTimeout(S.stableTimer);
    log('🎙️ Écoute active');
  };
  r.onspeechstart = () => log('Voix détectée');
  r.onaudiostart = () => log('➜ audiostart : Safari reçoit le micro');
  r.onsoundstart = () => log('➜ soundstart : du son est entendu');
  r.onsoundend = () => log('➜ soundend');
  r.onspeechend = () => {
    log('➜ speechend');
    clearTimeout(S.stableTimer);
    if (!S.consumed && S.lastText && !S.playing) handle(S.lastText, false);
  };
  r.onaudioend = () => log('➜ audioend');
  r.onnomatch = () => log('➜ nomatch : son entendu mais pas compris');
  r.onresult = e => {
    if (S.playing) return;
    const res = e.results[e.results.length - 1];
    if (!res || !res[0]) return;
    const text = res[0].transcript.trim();
    S.lastText = text;
    S.lastConf = typeof res[0].confidence === 'number' ? res[0].confidence : 0;
    log((res.isFinal ? 'FINAL' : 'interim') + ' : ' + text);
    clearTimeout(S.stableTimer);
    if (res.isFinal) { handle(text, true); return; }
    const cand = peek(text);
    if (cand) {
      prepareAudio(cand);                                   // le MP3 se charge déjà
      const delay = PASSWORD[S.lang].test(norm(text)) ? 0 : 350;   // 350 ms sans changement = phrase terminée
      S.stableTimer = setTimeout(() => handle(text, false), delay);
    }
  };
  r.onerror = e => {
    log('ERREUR reco : ' + e.error);
    S.starting = false;
    if (['not-allowed','service-not-allowed','language-not-supported'].includes(e.error)) S.needGesture = true;
  };
  r.onend = () => {
    clearTimeout(S.startTimer);
    S.running = false; S.starting = false;
    log('Écoute terminée');
    // Si Safari a coupé sans résultat final, on exploite la dernière transcription
    if (!S.consumed && S.lastText && !S.playing) handle(S.lastText, true);
    if (S.needGesture || !S.started) return;
    setTimeout(startRecognition, 100);
  };
  S.rec = r;
  return true;
}

function startRecognition(){
  if (!S.rec || S.running || S.starting) return;
  S.starting = true;
  // Filet de sécurité : si Safari ne répond jamais, on débloque le flag
  clearTimeout(S.startTimer);
  S.startTimer = setTimeout(() => { if (!S.running) { S.starting = false; log('start() sans réponse — flag réinitialisé'); startRecognition(); } }, 4000);
  try { S.rec.start(); log('recognition.start() envoyé'); }
  catch (err) {
    S.starting = false;
    log('Erreur start : ' + err.name + ' / ' + err.message);
    if (err.name !== 'InvalidStateError') S.needGesture = true;
  }
}

function restartRecognition(){
  if (!S.started) return;
  const old = S.rec;
  if (old) { old.onstart = old.onend = old.onerror = old.onresult = old.onspeechstart = null; try { old.abort(); } catch(_){} }
  S.running = S.starting = S.needGesture = false;
  if (initRecognition()) startRecognition();
  log('Micro relancé');
}

// ============================================================
// DÉMARRAGE (geste du GM)
// ============================================================
$('dbgBtn').addEventListener('click', () => {
  setDebug(!DEBUG);
  $('dbgBtn').textContent = '🐛 Diagnostic : ' + (DEBUG ? 'ON' : 'OFF');
  log('Diagnostic activé');
});

$('noVideoBtn').addEventListener('click', () => {
  NOVIDEO = !NOVIDEO; $('noVideoBtn').textContent = '🎥 Vidéos : ' + (NOVIDEO ? 'OFF' : 'ON');
  if (!DEBUG) { setDebug(true); $('dbgBtn').textContent = '🐛 Diagnostic : ON'; }
  log('Vidéos idle ' + (NOVIDEO ? 'désactivées' : 'activées'));
});
$('noUnlockBtn').addEventListener('click', () => {
  NOUNLOCK = !NOUNLOCK; $('noUnlockBtn').textContent = '🔓 Déblocage audio : ' + (NOUNLOCK ? 'OFF' : 'ON');
  if (!DEBUG) { setDebug(true); $('dbgBtn').textContent = '🐛 Diagnostic : ON'; }
  log('Déblocage audio ' + (NOUNLOCK ? 'désactivé' : 'activé'));
});
// Test du micro indépendant de la reconnaissance : affiche le niveau sonore pendant 6 s
$('micTestBtn').addEventListener('click', async () => {
  if (!DEBUG) { setDebug(true); $('dbgBtn').textContent = '🐛 Diagnostic : ON'; }
  log('Test micro : parle pendant 6 secondes…');
  try {
    const stream = await navigator.mediaDevices.getUserMedia({audio:true});
    const AC = window.AudioContext || window.webkitAudioContext;
    const ctx = new AC();
    const src = ctx.createMediaStreamSource(stream);
    const an = ctx.createAnalyser(); an.fftSize = 512; src.connect(an);
    const buf = new Uint8Array(an.fftSize);
    let n = 0;
    const iv = setInterval(() => {
      an.getByteTimeDomainData(buf);
      let max = 0; for (const v of buf) max = Math.max(max, Math.abs(v - 128));
      log('niveau micro : ' + '█'.repeat(Math.round(max / 4)) + ' ' + max);
      if (++n >= 12) { clearInterval(iv); stream.getTracks().forEach(t => t.stop()); ctx.close(); log('Test micro terminé'); }
    }, 500);
  } catch (e) { log('Test micro ÉCHEC : ' + e.name + ' / ' + e.message); }
});

document.querySelectorAll('#launch button[data-lang]').forEach(btn => btn.addEventListener('click', () => {
  if (S.started) return;
  S.lang = btn.dataset.lang;
  S.started = true;
  $('bandeau').textContent = BANDEAU[S.lang];
  document.documentElement.lang = S.lang;

  // 1) Le micro démarre EN PREMIER, dans le geste du GM
  if (initRecognition()) startRecognition();

  // 2) Le déblocage audio juste après, dans le même geste (obligatoire sur iOS)
  if (!NOUNLOCK) {
    voice.src = 'data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YQAAAAA=';
    voice.play().then(() => { voice.pause(); log('Audio débloqué'); }).catch(e => log('Unlock audio refusé : ' + e.message));
  }

  // 3) Les vidéos et le préchargement démarrent une fois le micro stabilisé
  setTimeout(() => { log('Démarrage vidéo idle'); showIdle(); }, 1500);
  setTimeout(preloadAudio, 6000);
  scheduleHint();

  try {
    const root = document.documentElement, fs = root.requestFullscreen || root.webkitRequestFullscreen;
    if (fs) { const p = fs.call(root); if (p && p.catch) p.catch(()=>{}); }
  } catch(_){}

  $('launch').classList.add('hidden');
}));

// Tap de secours n'importe où si Safari a demandé un geste
document.addEventListener('touchstart', () => {
  if (S.started && S.needGesture) { S.needGesture = false; restartRecognition(); }
}, {passive:true});

// 5 taps dans le coin haut gauche (écran miroir) = relance discrète du micro
let taps = 0, tapTimer = null;
$('tapZone').addEventListener('click', () => {
  if (!S.started) return;
  clearTimeout(tapTimer); tapTimer = setTimeout(() => taps = 0, 2000);
  if (++taps >= 5) { taps = 0; restartRecognition(); }
});

// Retour au premier plan
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible' && S.started)
    setTimeout(() => { if (!S.running && !S.needGesture) startRecognition(); }, 800);
});

// Préchargement doux des MP3 (un seul à la fois)
function preloadAudio(){
  const queue = Object.values(A(S.lang)).concat(NOT_UNDERSTOOD[S.lang].map(f => f + '.mp3'));
  const cache = [];
  const next = () => {
    if (!queue.length) return;
    if (S.playing) return setTimeout(next, 500);
    const a = new Audio(); cache.push(a);
    a.preload = 'auto';
    a.onloadeddata = a.onerror = () => setTimeout(next, 100);
    a.src = queue.shift();
  };
  next();
}

window.addEventListener('error', e => log('ERREUR JS : ' + e.message + ' (ligne ' + e.lineno + ')'));
window.addEventListener('unhandledrejection', e => log('PROMESSE REJETÉE : ' + (e.reason && e.reason.message || e.reason)));
log('Astra chargée — en attente du choix de langue');
log('Page sécurisée (HTTPS) : ' + window.isSecureContext + ' | protocole : ' + location.protocol);
log('SpeechRecognition : ' + !!(window.SpeechRecognition || window.webkitSpeechRecognition));
log('Navigateur : ' + navigator.userAgent);
</script>
